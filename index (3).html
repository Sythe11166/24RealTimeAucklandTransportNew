<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stop 8274">
<meta name="theme-color" content="#0e1317">
<title>Stop 8274</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{color-scheme:dark;--bg:#0e1317;--panel:#161d23;--line:#25303a;--text:#e8edf0;--muted:#8a98a3;--accent:#5eead4;--ok:#5eead4;--mid:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{display:grid;grid-template-columns:minmax(340px,42%) 1fr;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 38vh;height:auto;min-height:100%}}
aside{padding:20px;overflow:auto;border-right:1px solid var(--line)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bus{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
.route{font-size:30px;font-weight:800;letter-spacing:-.02em;grid-row:span 2}
.eta{font-size:34px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;grid-row:span 2}
.eta small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.dist{color:var(--muted);font-size:14px}
.crowd{grid-column:1/-1;margin-top:10px;display:flex;align-items:center;gap:12px}
.meter{display:flex;gap:4px;flex:1}
.meter i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.crowd span{font-size:14px;min-width:130px;text-align:right}
.note{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:14px}
.err{color:var(--bad);font-size:14px;padding:12px 14px;border:1px solid #5b2a2a;border-radius:12px;margin-bottom:12px;white-space:pre-wrap}
#status{color:var(--muted);font-size:13px;margin-top:8px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#map{height:100%;background:#0b0f13}
.leaflet-container{background:#0b0f13;font:inherit}
.pin{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #0e1317;box-shadow:0 0 0 2px var(--accent)}
.bpin{background:#e8edf0;color:#0e1317;font-weight:800;font-size:12px;border-radius:8px;padding:3px 7px;border:2px solid #0e1317;white-space:nowrap;width:auto!important;height:auto!important}
</style>
</head>
<body>
<aside>
  <header><h1 id="title">Stop 8274</h1><button id="open">Settings</button></header>
  <p class="sub" id="stopname">Looking up stop…</p>
  <div id="err"></div>
  <div id="list"></div>
  <div id="status"></div>
</aside>
<div id="map" role="img" aria-label="Map of the bus stop and approaching buses"></div>

<dialog id="dlg">
  <h2 style="margin:0 0 4px;font-size:20px">Settings</h2>
  <p class="sub" style="margin:0">Saved only on this iPad.</p>
  <label for="key">AT API key (from dev-portal.at.govt.nz)</label>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="stop">Stop code</label>
  <input id="stop" inputmode="numeric" value="8274">
  <label for="routes">Services to show (comma separated, blank for all)</label>
  <input id="routes" value="24R,24B" autocapitalize="characters">
  <label for="mapkey">CARTO map key (from carto.com/basemaps/apikey)</label>
  <input id="mapkey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="base">API address</label>
  <input id="base" value="https://api.at.govt.nz" autocapitalize="off" spellcheck="false">
  <div class="row"><button id="cancel" type="button">Cancel</button><button id="save" type="button" style="border-color:var(--accent);color:var(--accent)">Save</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cfg=()=>({key:store.get('key',''),mapkey:store.get('mapkey',''),stop:store.get('stop','8274'),routes:store.get('routes','24R,24B'),base:store.get('base','https://api.at.govt.nz').replace(/\/$/,'')});
const OCC=[['Empty',1],['Plenty of seats',1],['Few seats',2],['Standing room only',3],['Very crowded',4],['Full',4],['Not taking passengers',4]];
const COL=['#5eead4','#5eead4','#fbbf24','#fb923c','#f87171'];
let stopPos=null,map,stopMarker,busLayer,timer,tiles;

function initMap(){
  map=L.map('map',{zoomControl:true}).setView([-36.8485,174.7633],13);
  busLayer=L.layerGroup().addTo(map);
  setTiles();
}
function setTiles(){
  if(tiles)tiles.remove();
  const k=cfg().mapkey;
  tiles=L.tileLayer('https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png'+(k?'?key='+encodeURIComponent(k):''),{attribution:'&copy; OpenStreetMap, &copy; CARTO',maxZoom:19}).addTo(map);
  tiles.bringToBack();
}
function km(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))}
const fmtDist=k=>k<1?Math.round(k*10)*100+' m away':k.toFixed(1)+' km away';
const arr=x=>x==null?[]:Array.isArray(x)?x:[x];
async function api(path){
  const c=cfg();
  const r=await fetch(c.base+path,{headers:{'Ocp-Apim-Subscription-Key':c.key}});
  if(!r.ok)throw new Error('AT returned '+r.status+' for '+path);
  return r.json();
}
const entities=j=>(j&&j.response&&(j.response.entity||j.response.entities))||(j&&(j.entity||j.entities))||[];

async function findStop(){
  const c=cfg();
  const j=await api('/gtfs/v3/stops?filter[stop_code]='+encodeURIComponent(c.stop)).catch(()=>api('/v2/gtfs/stops/stopCode/'+encodeURIComponent(c.stop)));
  const d=arr(j.data||j.response)[0];
  if(!d)throw new Error('Stop '+c.stop+' was not found. Check the stop code in Settings.');
  const a=d.attributes||d;
  stopPos={id:a.stop_id||d.id,lat:+a.stop_lat,lon:+a.stop_lon,name:a.stop_name};
  $('stopname').textContent=(stopPos.name||'')+' · stop '+c.stop;
  if(stopMarker)stopMarker.remove();
  stopMarker=L.marker([stopPos.lat,stopPos.lon],{icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[18,18]})}).addTo(map).bindTooltip('Stop '+c.stop);
  map.setView([stopPos.lat,stopPos.lon],15);
}

async function refresh(){
  const c=cfg(),err=$('err');
  err.innerHTML='';
  if(!c.key){$('list').innerHTML='<div class="note">Add your free Auckland Transport API key in Settings to see live buses.</div>';return}
  try{
    if(!stopPos||stopPos.code!==c.stop){await findStop();stopPos.code=c.stop}
    const [tu,vp]=await Promise.all([api('/realtime/legacy/tripupdates'),api('/realtime/legacy/vehiclelocations')]);
    const veh={};
    entities(vp).forEach(e=>{const v=e.vehicle;if(v&&v.vehicle)veh[v.vehicle.id]=v});
    const want=c.routes.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
    const now=Date.now()/1000,out=[];
    entities(tu).forEach(e=>{
      const t=e.trip_update;if(!t)return;
      const route=String((t.trip&&t.trip.route_id)||'').split('-')[0].toUpperCase();
      if(want.length&&!want.includes(route))return;
      const s=arr(t.stop_time_update).find(u=>u.stop_id===stopPos.id||String(u.stop_id).startsWith(c.stop+'-'));
      if(!s)return;
      const tm=(s.arrival&&s.arrival.time)||(s.departure&&s.departure.time);
      if(!tm||tm<now-60)return;
      const vid=t.vehicle&&t.vehicle.id,v=vid&&veh[vid];
      out.push({route,mins:Math.max(0,Math.round((tm-now)/60)),v});
    });
    out.sort((a,b)=>a.mins-b.mins);
    busLayer.clearLayers();
    $('list').innerHTML=out.length?out.slice(0,6).map(b=>{
      let dist='Location not reported',occ='No crowding data',lvl=0;
      if(b.v&&b.v.position){
        const p=b.v.position;
        dist=fmtDist(km(stopPos.lat,stopPos.lon,+p.latitude,+p.longitude));
        L.marker([+p.latitude,+p.longitude],{icon:L.divIcon({className:'',html:'<div class="bpin">'+b.route+'</div>'})}).addTo(busLayer);
      }
      if(b.v&&b.v.occupancy_status!=null){
        const o=b.v.occupancy_status,i=typeof o==='number'?o:['EMPTY','MANY_SEATS_AVAILABLE','FEW_SEATS_AVAILABLE','STANDING_ROOM_ONLY','CRUSHED_STANDING_ROOM_ONLY','FULL','NOT_ACCEPTING_PASSENGERS'].indexOf(o);
        if(OCC[i]){occ=OCC[i][0];lvl=OCC[i][1]}
      }
      const segs=[1,2,3,4].map(n=>'<i style="background:'+(n<=lvl?COL[lvl]:'')+'"></i>').join('');
      return '<div class="bus"><div class="route">'+b.route+'</div><div class="eta">'+(b.mins<1?'Due':b.mins)+(b.mins<1?'':'<small>min</small>')+'</div><div class="dist">'+dist+'</div><div class="crowd"><div class="meter" aria-hidden="true">'+segs+'</div><span>'+occ+'</span></div></div>';
    }).join(''):'<div class="note">No '+(want.join(' or ')||'')+' buses are due at this stop right now.</div>';
    $('status').textContent='Updated '+new Date().toLocaleTimeString('en-NZ',{hour:'numeric',minute:'2-digit',second:'2-digit'})+' · refreshes every 20 seconds';
  }catch(e){
    const cors=e instanceof TypeError?'\n\nThe request was blocked before AT replied. This usually means AT does not allow calls straight from a browser (CORS), or the API address or key is wrong. A small relay is the fix; ask Claude to add one.':'';
    err.innerHTML='<div class="err">'+String(e.message).replace(/</g,'&lt;')+cors.replace(/</g,'&lt;')+'</div>';
  }
}

function start(){clearInterval(timer);stopPos=null;$('title').textContent='Stop '+cfg().stop;refresh();timer=setInterval(()=>{if(!document.hidden)refresh()},20000)}
$('open').onclick=()=>{const c=cfg();$('key').value=c.key;$('mapkey').value=c.mapkey;$('stop').value=c.stop;$('routes').value=c.routes;$('base').value=c.base;$('dlg').showModal()};
$('cancel').onclick=()=>$('dlg').close();
$('save').onclick=()=>{store.set('key',$('key').value.trim());store.set('mapkey',$('mapkey').value.trim());store.set('stop',$('stop').value.trim()||'8274');store.set('routes',$('routes').value);store.set('base',$('base').value.trim()||'https://api.at.govt.nz');$('dlg').close();setTiles();start()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
initMap();start();
</script>
</body>
</html>
