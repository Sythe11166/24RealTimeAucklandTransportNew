<!DOCTYPE html>
<html lang="en-NZ">
<head>

<title>Today · Auckland</title>
<style>
:root{--b1:#02040a;--b2:#070f24;--b3:#0c1b40;--o1:#1c2f7a;--o2:#0f3b6b;--o3:#35246b;--stars:1;--rays:0;--ft:rgba(255,255,255,.5);--gap:clamp(18px,2.4vw,28px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#070f24;font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(170deg,var(--b1),var(--b2) 55%,var(--b3)) fixed}
.o{position:fixed;border-radius:50%;filter:blur(90px);opacity:.6;z-index:0;transition:background 3s;animation:dr 28s ease-in-out infinite alternate}
.o:nth-child(1){width:48vw;height:48vw;left:-10vw;top:-12vw;background:var(--o1)}
.o:nth-child(2){width:40vw;height:40vw;right:-8vw;top:28vh;background:var(--o2);animation-delay:-9s}
.o:nth-child(3){width:36vw;height:36vw;left:28vw;bottom:-16vw;background:var(--o3);animation-delay:-18s}
@keyframes dr{to{transform:translate(6vw,5vh) scale(1.15)}}
.rays{position:fixed;left:-30vmax;top:-30vmax;width:90vmax;height:90vmax;border-radius:50%;z-index:0;pointer-events:none;opacity:var(--rays);transition:opacity 4s;background:repeating-conic-gradient(from 0deg,rgba(255,246,200,.34) 0 4deg,transparent 4deg 16deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 68%);mask-image:radial-gradient(circle,#000 0,transparent 68%);animation:spin 160s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--stars);transition:opacity 3s;animation:tw 6s ease-in-out infinite alternate;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 12%,#fff,transparent),radial-gradient(1px 1px at 61% 38%,#fff,transparent),radial-gradient(1.5px 1.5px at 77% 74%,#fff,transparent),radial-gradient(1px 1px at 88% 22%,#fff,transparent),radial-gradient(1px 1px at 5% 84%,#fff,transparent),radial-gradient(1.5px 1.5px at 53% 90%,#fff,transparent),radial-gradient(1px 1px at 36% 40%,#fff,transparent),radial-gradient(1px 1px at 93% 58%,#fff,transparent)}
@keyframes tw{50%{filter:brightness(.5)}}
#fx{position:fixed;left:0;top:0;z-index:1;pointer-events:none}
main{position:relative;z-index:2;height:100vh;height:100dvh;display:grid;gap:var(--gap);grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:1.3fr 1.1fr 1fr 30px;grid-template-areas:"t t t w w w w w w w w w" "b b b b b b a a a s s s" "q q q q q q n n n n n n" "f f f f f f f f f f f f";padding:max(22px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
#time{grid-area:t}#wx{grid-area:w}#bus{grid-area:b}#al{grid-area:a}#st{grid-area:s}#q{grid-area:q}#nw{grid-area:n}#ft{grid-area:f}
@media(orientation:portrait){main{grid-template-rows:.8fr 1.15fr 1.2fr .9fr .85fr 30px;grid-template-areas:"t t t t t t a a a a a a" "w w w w w w w w w w w w" "b b b b b b b b b b b b" "s s s s s s q q q q q q" "n n n n n n n n n n n n" "f f f f f f f f f f f f"}#sl{display:grid;grid-template-columns:1fr 1fr;gap:20px}.s{border:0!important;padding:0!important}}
@media(max-width:700px){html,body{overflow:auto}main{height:auto;grid-template-areas:none;grid-template-rows:none;grid-template-columns:1fr}main>*{grid-area:auto!important;min-height:220px}}
/* liquid glass widgets */
.g{--tx:#fff;--mu:rgba(255,255,255,.64);--c1:rgba(255,255,255,.2);--c2:rgba(255,255,255,.08);position:relative;isolation:isolate;min-height:0;display:flex;flex-direction:column;overflow:hidden auto;scrollbar-width:none;color:var(--tx);border-radius:32px;padding:clamp(16px,1.9vw,24px);background:linear-gradient(145deg,var(--c1),var(--c2));backdrop-filter:blur(28px) saturate(1.9);-webkit-backdrop-filter:blur(28px) saturate(1.9);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 0 0 1px rgba(255,255,255,.2),inset 0 -14px 28px rgba(255,255,255,.07),0 26px 50px rgba(8,16,40,.22),0 4px 12px rgba(8,16,40,.12);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.g:hover{transform:translateY(-4px) scale(1.006)}
.g::-webkit-scrollbar{display:none}
.g::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;transition:opacity .3s;background:radial-gradient(300px circle at var(--mx,30%) var(--my,-20%),rgba(255,255,255,.5),transparent 62%)}
.g.lit::before{opacity:1}
.g::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%) 0 0/300% 100%;animation:sh 14s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.w-white{--tx:#14181f;--mu:rgba(20,24,31,.55);--c1:rgba(255,255,255,.86);--c2:rgba(255,255,255,.66)}
.w-cream{--tx:#33241a;--mu:rgba(51,36,26,.6);--c1:rgba(255,247,228,.9);--c2:rgba(255,226,176,.74)}
.w-amber{--tx:#2e1b00;--mu:rgba(46,27,0,.62);--c1:rgba(255,214,10,.92);--c2:rgba(255,150,20,.82)}
.w-teal{--c1:rgba(7,92,98,.84);--c2:rgba(12,140,118,.7)}
.w-black{--c1:rgba(10,12,16,.88);--c2:rgba(32,36,46,.76)}
.w-sky{--c1:rgba(40,130,240,.9);--c2:rgba(140,205,255,.78)}
h2{margin:0 0 10px;font-size:12px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu)}.sub{color:var(--mu);font-size:13px}
button{font:inherit;color:inherit;background:none;border:0}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
.fi{animation:fi .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fi{from{opacity:0;transform:translateY(8px) scale(.99)}}
.dots{display:flex;gap:5px;justify-content:center;margin-top:auto;padding-top:8px;min-height:14px}
.dots i{width:5px;height:5px;border-radius:3px;background:currentColor;opacity:.25;transition:all .4s}.dots i.on{opacity:.85;width:15px}
/* clock */
#time{align-items:center;text-align:center}#time h2{align-self:flex-start}
#ck{flex:1;min-height:0;width:100%;max-height:150px}
#dg{font-size:22px;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:6px}#dg small{font-size:13px;color:var(--mu)}
#dt{font-size:13px;color:var(--mu)}
/* weather */
.wg{flex:1;min-height:0;display:grid;grid-template-columns:minmax(140px,.8fr) 1.7fr minmax(190px,1fr);gap:clamp(12px,2vw,26px)}
.c1{display:flex;flex-direction:column;justify-content:center;gap:2px}
#wi svg{width:60px;height:60px}
.big{font-size:58px;font-weight:200;letter-spacing:-.045em;line-height:1}
.c2{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
#cv{width:100%;height:34px;display:block}
.hrs{display:grid;grid-template-columns:repeat(6,1fr);text-align:center}
.hrs div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.hrs svg{width:22px;height:22px}.hrs .r{font-size:11px;min-height:13px;opacity:.85}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.dy{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.14);font-size:13px}
.dy svg{width:20px;height:20px}.dy b{font-weight:600}
.c3{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
.tl{border-radius:18px;background:rgba(255,255,255,.14);padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.tl span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}.tl b{font-size:19px;font-weight:600;display:flex;align-items:center;gap:6px}
.tl .br{height:3px;border-radius:2px;background:rgba(255,255,255,.25)}.tl .br i{display:block;height:100%;border-radius:2px;background:#fff;transition:width 1s}
.ar{width:18px;height:18px;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.anim .ray{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.anim .fl{animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(1.5px,-1px)}}
.anim .dr path{animation:dp 1.1s linear infinite}.anim .dr path:nth-child(2){animation-delay:-.4s}.anim .dr path:nth-child(3){animation-delay:-.8s}
@keyframes dp{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(3px);opacity:0}}
/* bus */
#bl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;align-content:start}
.b{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:11px 14px;border-radius:20px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.b b{font-size:19px;font-weight:800;grid-row:span 2;padding:5px 11px;border-radius:12px;color:#102027}
.b .e{font-size:28px;font-weight:300;grid-row:span 2;text-align:right;font-variant-numeric:tabular-nums}.b .e small{font-size:12px;opacity:.7;margin-left:3px}
.b i{font-style:normal;opacity:.75;font-size:12px}.lv{color:#7ef0c3;opacity:1}
.b.none{opacity:.7}
.bd{display:inline-block;padding:0 7px;border-radius:999px;font-size:11px;margin-left:6px;border:1px solid currentColor}
.m{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px}
.m div{display:flex;gap:3px;flex:1}.m u{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.note{grid-column:1/-1;font-size:12px;opacity:.75}.err{color:#ffb4b4;font-size:12px;white-space:pre-wrap;margin-bottom:8px}
details{margin-top:auto;padding-top:6px;font-size:11px;opacity:.45}summary{min-height:28px;display:flex;align-items:center;cursor:pointer}pre{white-space:pre-wrap;word-break:break-all;margin:0}
/* alerts + news + quote */
#alb,#nb{flex:1;min-height:0}
.ah{font-size:16px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ap{font-size:13px;margin:6px 0 0;opacity:.8;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ok{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.ok svg{width:34px;height:34px}
.tag{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:#e0301e}
#nb h3{margin:4px 0 6px;font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#nb p{margin:0;font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#nb a{color:#e0301e;font-size:12px;font-weight:600;text-decoration:none}
#q{cursor:pointer;justify-content:center}
#qb{text-align:left}
#qt{font:italic 400 clamp(15px,1.9vw,22px)/1.3 ui-serif,"New York",Georgia,serif;margin:0}
#qa{margin:6px 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
#qm{font-size:13px;line-height:1.4;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#qm b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#b4531a;margin-right:6px}
/* markets */
.s{padding:10px 0;border-top:1px solid rgba(255,255,255,.12)}.s:first-of-type{border:0;padding-top:0}
.s .top{display:flex;justify-content:space-between;align-items:baseline}
.s b{font-size:18px;font-weight:650}.s .p{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}.s .ch{font-size:12px;font-variant-numeric:tabular-nums}
.rg{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.16);margin:9px 0 3px}
.rg i{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 14px #6ee7b7;transition:left .8s}
/* footer + settings */
#ft{display:flex;justify-content:space-between;align-items:center;color:var(--ft);font-size:11px;letter-spacing:.04em}
#gear{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;opacity:.55;color:var(--ft);position:relative}
#gear::after{content:"";position:absolute;inset:-7px}
#gear svg{width:17px;height:17px}
dialog{background:#101a2e;color:#eaf1fb;border:1px solid rgba(255,255,255,.15);border-radius:26px;padding:22px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(2,8,20,.7)}
label{display:block;font-size:13px;color:#a9bbd6;margin:12px 0 4px}
input{width:100%;font:inherit;color:#eaf1fb;background:#08101f;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;min-height:44px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.row button{padding:10px 18px;min-height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
@media(prefers-reduced-motion:reduce){.o,.rays,.stars,.g::after,.anim *{animation:none!important}.fi{animation:none}}
</style>
</head>
<body>

<main>
  <section class="g w-white" id="time"><h2>Auckland</h2>
    <svg id="ck" viewBox="0 0 120 120" aria-hidden="true"></svg>
    <div id="dg"><span id="hm">--:--</span><small id="ap"></small></div><div id="dt"></div></section>
  <section class="g w-sky" id="wx"><h2>Weather · Auckland</h2>
    <div class="wg"><div class="c1"><div id="wi"></div><div class="big" id="wt">--</div><div id="wd" class="sub" style="color:inherit;opacity:.9">Loading…</div><div class="sub" id="whl" style="color:inherit;opacity:.75"></div></div>
    <div class="c2"><div><svg id="cv" viewBox="0 0 600 34" preserveAspectRatio="none"></svg><div class="hrs" id="hrs"></div></div><div class="days" id="days"></div></div>

  <section class="g w-amber" id="al"><h2>Service alerts</h2><div id="alb"></div><div class="dots" id="ald"></div></section>

  <section class="g w-white" id="nw"><h2>NZ news · Auckland, transport, politics</h2><div id="nb"></div><div class="dots" id="nd"></div></section>
  <div id="ft"><span id="fs"></span><button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>

<script>
const $=id=>document.getElementById(id),TZ='Pacific/Auckland',arr=x=>x==null?[]:Array.isArray(x)?x:[x],REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
const LS={g(k,d=''){try{return localStorage.getItem(k)??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cfg=()=>({at:LS.g('at'),fh:LS.g('fh'),stop:LS.g('stop','8274'),routes:LS.g('routes','24R,24B')});
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const fmtM=t=>{const h=Math.floor(t/60);return (h%12||12)+':'+String(Math.round(t%60)).padStart(2,'0')+(h<12?'am':'pm')};

/* ---------- quotes with meaning ---------- */
const Q=[["We suffer more often in imagination than in reality.","Seneca","Most of what we dread never happens. Worry rehearses pain in advance, so meet each problem when it actually arrives."],["The unexamined life is not worth living.","Socrates","A life on autopilot misses its point. Question your habits, beliefs and choices so you live on purpose."],["What stands in the way becomes the way.","Marcus Aurelius","Obstacles aren’t detours from the path, they are the path. Treat each setback as material to work with."],["It is not that we have a short time to live, but that we waste much of it.","Seneca","Life is long enough if used well. The real loss is the hours we hand to distraction and delay."],["Nothing endures but change.","Heraclitus","Everything is in motion, so clinging to how things were causes suffering. Adapting is the only stable strategy."],["He who has a why to live can bear almost any how.","Friedrich Nietzsche","A strong purpose makes hardship bearable. Know what you’re living for and the difficulty weighs less."],["Man is condemned to be free.","Jean-Paul Sartre","You can’t escape choosing, so you own the consequences. Even not choosing is a choice."],["The only thing I know is that I know nothing.","Socrates","Wisdom starts with admitting the limits of what you know. Humility keeps you curious and teachable."],["Happiness depends upon ourselves.","Aristotle","Contentment comes from how we act and think, not from luck. Cultivate good habits and character."],["We are what we repeatedly do. Excellence, then, is not an act, but a habit.","Will Durant, on Aristotle","Greatness is built from small daily practices, not one heroic moment. Your routines shape who you become."],["Man is the measure of all things.","Protagoras","Truth and value are judged from human experience and perspective. It invites us to take other viewpoints seriously."],["Wonder is the feeling of a philosopher, and philosophy begins in wonder.","Plato","Curiosity is where deep thinking starts. Stay amazed by ordinary things and the questions keep coming."],["Life must be understood backwards, but it must be lived forwards.","Søren Kierkegaard","Only in hindsight does the pattern make sense, yet you must decide before you know. Act despite uncertainty."],["People are disturbed not by things, but by the views they take of them.","Epictetus","It’s our judgement of events, not the events, that upsets us. Change the interpretation and the distress shrinks."],["The soul becomes dyed with the colour of its thoughts.","Marcus Aurelius","What you repeatedly think shapes your character. Guard your thinking like you’d guard your diet."],["When we are no longer able to change a situation, we are challenged to change ourselves.","Viktor Frankl","Some circumstances can’t be fixed, but our response always can. Growth often begins where control ends."],["I think, therefore I am.","René Descartes","Even if everything else can be doubted, the act of doubting proves a thinker exists. It’s a foundation for certainty."],["Whereof one cannot speak, thereof one must be silent.","Ludwig Wittgenstein","Some things lie beyond what words can clearly say. Be honest about where language and knowledge stop."],["The limits of my language mean the limits of my world.","Ludwig Wittgenstein","What we can name shapes what we can think. A richer vocabulary widens how much of life you can perceive."],["He who fights with monsters should be careful lest he thereby become a monster.","Friedrich Nietzsche","Long battles with something ugly can change you. Watch that fighting an enemy doesn’t make you resemble them."],["It is not the man who has too little, but the man who craves more, that is poor.","Seneca","Wealth is about wanting, not having. Endless desire leaves you poor at any income."],["Waste no more time arguing about what a good man should be. Be one.","Marcus Aurelius","Stop debating virtue and practise it. Character shows in actions, not opinions."],["Freedom is secured not by the fulfilling of one’s desires, but by the removal of desire.","Epictetus","Chasing every want makes you its servant. Wanting less is a faster route to being free."],["Hope is a good breakfast, but it is a bad supper.","Francis Bacon","Optimism fuels a start but can’t sustain the finish. Pair hope with plans and results."],["Attention is the rarest and purest form of generosity.","Simone Weil","Truly focusing on someone, without fixing or judging, is a real gift. Presence costs more than money."],["One must imagine Sisyphus happy.","Albert Camus","Even endless, repetitive effort can hold meaning if you embrace it. Find purpose in the doing, not only the outcome."],["The journey of a thousand miles begins with a single step.","Laozi","Big goals feel overwhelming until you start. Begin with the next small, concrete action."],["Knowing others is intelligence; knowing yourself is true wisdom.","Laozi","Understanding people is clever, but understanding your own motives is deeper. Self-knowledge guides every other decision."],["Real knowledge is to know the extent of one’s ignorance.","Confucius","Knowing what you don’t know marks a true expert. It prevents overconfidence and invites learning."],["Do not weep; do not wax indignant. Understand.","Baruch Spinoza","Rather than react with anger or grief, look for causes. Understanding brings calm and better responses."],["All of humanity’s problems stem from man’s inability to sit quietly in a room alone.","Blaise Pascal","We chase distraction to avoid our own thoughts. Learning to be still can solve more than constant busyness."],["You could leave life right now. Let that determine what you do and say and think.","Marcus Aurelius","Remembering life is finite sharpens priorities. Act today as though it counts, because it does."],["Do not spoil what you have by desiring what you have not.","Epicurus","Dwelling on what’s missing dulls what’s already good. Practise gratitude for what you have now."],["Dare to know! Have function nowMin(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return (+p.hour%24)*60+ +p.minute+ +p.second/60}
function sunCalc(){
  const p=aklParts(),N=Math.floor((Date.UTC(+p.year,+p.month-1,+p.day)-Date.UTC(+p.year,0,0))/864e5),R=Math.PI/180,lat=-36.85*R,lh=174.76/15,u=new Date();
  const off=(((nowMin()-(u.getUTCHours()*60+u.getUTCMinutes()+u.getUTCSeconds()/60))+600)%1440+1440)%1440-600;
  const f=up=>{const t=N+((up?6:18)-lh)/24,M=.9856*t-3.289,L=((M+1.916*Math.sin(M*R)+.02*Math.sin(2*M*R)+282.634)%360+360)%360;
    let RA=Math.atan(.91764*Math.tan(L*R))/R;RA=(RA%360+360)%360;RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90;RA/=15;
    const sd=.39782*Math.sin(L*R),ch=(Math.cos(90.833*R)-sd*Math.sin(lat))/(Math.cos(Math.asin(sd))*Math.cos(lat)),H=(up?360-Math.acos(ch)/R:Math.acos(ch)/R)/15,T=H+RA-.06571*t-6.622;

  return [f(true),f(false)];
}

const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>a.map((c,i)=>{const x=hx(c),y=hx(b[i]);return '#'+x.map((v,k)=>Math.round(v+(y[k]-v)*t).toString(16).padStart(2,'0')).join('')});

function phasePal(ph){const k=WX.kind,clear=k==='sun'||k==='part';return ph==='night'?NIGHT[k]:ph==='day'?DAY[k]:mix(DAY[k],TW[ph],clear?.8:.4)}
function skyBg(){
  const n=nowMin(),K=[[SR-60,'night'],[SR-5,'dawn'],[SR+50,'day'],[SS-100,'day'],[SS-5,'dusk'],[SS+30,'night']];
  let pal=phasePal('night');const i=K.findIndex(k=>n<k[0]);
  if(i>0){const a=K[i-1],b=K[i];pal=mix(phasePal(a[1]),phasePal(b[1]),(n-a[0])/(b[0]-a[0]))}
  const st=document.documentElement.style,clear=WX.kind==='sun'||WX.kind==='part';
  ['b1','b2','b3','o1','o2','o3'].forEach((k,j)=>st.setProperty('--'+k,pal[j]));
  const sf=n<SR-30||n>SS+20?1:n<SR+30?(SR+30-n)/60:n>SS-10?(n-SS+10)/30:0;
  st.setProperty('--stars',(clear?1:.12)*sf);st.setProperty('--rays',clear&&n>SR+20&&n<SS-20?.85:0);
  const [r,g,b]=hx(pal[1]);st.setProperty('--ft',(r*299+g*587+b*114)/1000>150?'rgba(0,0,0,.5)':'rgba(255,255,255,.5)');

}

const fxc=$('fx'),fx=fxc.getContext('2d');let FW=0,FH=0,FD=1,FP=[],FM='none',FN=0,FL=0,FT=0,NX=4,raf=0;
function fxSet(m,n){FM=m;FN=n;const k=innerWidth*innerHeight/800000;FP=Array.from({length:Math.round(n*k)},()=>({x:Math.random()*FW,y:Math.random()*FH,v:.6+Math.random()*.8,r:Math.random()}))}
function fxSize(){FD=Math.min(2,devicePixelRatio||1);FW=fxc.width=innerWidth*FD;FH=fxc.height=innerHeight*FD;fxc.style.width=innerWidth+'px';fxc.style.height=innerHeight+'px';fxSet(FM,FN)}
function fxLoop(t){
  const dt=Math.min(.05,(t-FT)/1000||.016);FT=t;fx.clearRect(0,0,FW,FH);
  if(FM==='rain'||FM==='storm'){fx.strokeStyle='rgba(255,255,255,.42)';fx.lineWidth=1.2*FD;fx.beginPath();
    FP.forEach(p=>{const L=(14+p.r*16)*FD,sp=(900+p.v*700)*FD;fx.moveTo(p.x,p.y);fx.lineTo(p.x-L*.18,p.y+L);p.y+=sp*dt;p.x-=sp*dt*.18;if(p.y>FH||p.x<-40){p.y=-L;p.x=Math.random()*FW*1.15}});fx.stroke()}
  else if(FM==='snow'){fx.fillStyle='rgba(255,255,255,.85)';FP.forEach(p=>{fx.beginPath();fx.arc(p.x,p.y,(1.5+p.r*2.5)*FD,0,6.283);fx.fill();p.y+=(40+p.v*50)*FD*dt;p.x+=Math.sin(t/1000*p.v+p.r*10)*22*FD*dt;if(p.y>FH+8){p.y=-8;p.x=Math.random()*FW}})}
  else if(FM==='motes'){FP.forEach(p=>{fx.fillStyle='rgba(255,246,200,'+(.14+p.r*.16)+')';fx.beginPath();fx.arc(p.x,p.y,(2+p.r*6)*FD,0,6.283);fx.fill();p.y-=12*FD*dt*p.v;p.x+=Math.sin(t/2500+p.r*9)*8*FD*dt;if(p.y<-12){p.y=FH+12;p.x=Math.random()*FW}})}
  if(FM==='storm'){NX-=dt;if(NX<=0){FL=1;NX=5+Math.random()*9}FL=Math.max(0,FL-dt*2.2);if(FL>0){fx.fillStyle='rgba(255,255,255,'+FL*.3+')';fx.fillRect(0,0,FW,FH)}}
  raf=requestAnimationFrame(fxLoop);
}
function fxStart(){cancelAnimationFrame(raf);fx.clearRect(0,0,FW,FH);if(FM!=='none'&&!REDUCE&&!document.hidden)raf=requestAnimationFrame(fxLoop)}

const RT={};
function rotor(key,box,dots,render,ms){RT[key]={i:0,items:[],box,dots,render};setInterval(()=>{if(!document.hidden)step(key,1)},ms)}
function setItems(key,items){const r=RT[key],s=JSON.stringify(items);if(r.s===s)return;r.s=s;r.items=items;r.i=0;paint(key)}
function step(key,d){const r=RT[key];if(r.items.length>1){r.i=(r.i+d+r.items.length)%r.items.length;paint(key)}}

/* ---------- news (RNZ via rss2json, allorigins fallback) ---------- */
const FEEDS=[['https://www.rnz.co.nz/rss/national.xml',0],['https://www.rnz.co.nz/rss/political.xml',1],['https://www.rnz.co.nz/rss/ldr.xml',1]];
const clean=h=>{const t=document.createElement('textarea');t.innerHTML=String(h||'').replace(/<[^>]*>/g,' ');return t.value.replace(/\s+/g,' ').trim()};
const blurb=s=>{s=clean(s);if(s.length<=240)return s;const c=s.slice(0,240),i=Math.max(c.lastIndexOf('. '),c.lastIndexOf('? '));return i>110?c.slice(0,i+1):c.replace(/\s+\S*$/,'')+'…'};
const pdate=s=>/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(s||'')?new Date(s.replace(' ','T')+'Z'):new Date(s);
const ago=d=>{const m=Math.round((Date.now()-d)/6e4);return m<2?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
async function feed(u){
  try{const j=await(await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u))).json();if(j.status!=='ok')throw 0;return j.items.map(i=>({t:i.title,d:i.description||i.content,l:i.link,p:i.pubDate}))}
  catch(e){const x=new DOMParser().parseFromString(await(await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u))).text(),'text/xml');return [...x.querySelectorAll('item')].map(i=>{const g=n=>(i.querySelector(n)||{}).textContent||'';return{t:g('title'),d:g('description'),l:g('link'),p:g('pubDate')}})}
}
async function news(){
  try{
    const fs=await Promise.allSettled(FEEDS.map(f=>feed(f[0]).then(a=>a.map(x=>({...x,pol:f[1]})))));
    let it=fs.flatMap(r=>r.status==='fulfilled'?r.value:[]);if(!it.length)throw new Error('feeds unreachable');
    const seen=new Set();
    it=it.filter(x=>x.t&&!seen.has(x.t)&&seen.add(x.t)).map(x=>{const s=(x.t+' '+x.d).toLowerCase(),dt=pdate(x.p);let sc=x.pol?2:0;
      if(/auckland|tāmaki|tamaki|manukau|north shore|waitākere|waitakere/.test(s))sc+=4;
      if(/transport|\bbus(es)?\b|\btrains?\b|ferry|\brail\b|city rail link|commut|\bfares?\b|cycleway|motorway|roading/.test(s))sc+=3;
      if(/mayor|council|minister|government|parliament|labour|national party|greens|act party|nz first|luxon|hipkins|election|budget/.test(s))sc+=1;
      return{t:clean(x.t),b:blurb(x.d),l:x.l,src:'RNZ',ago:isNaN(dt)?'':ago(dt),sc:sc-Math.min((Date.now()-dt)/36e5/12,4)||sc}}).sort((a,b)=>b.sc-a.sc).slice(0,6);
    setItems('nw',it);
  }catch(e){setItems('nw',[{err:e.message}])}
}

/* ---------- markets ---------- */
function mkt(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),m=(+p.hour%24)*60+ +p.minute,O=570,C=960;
  const f=x=>{x=Math.round(x);const d=Math.floor(x/1440),h=Math.floor(x%1440/60);return (d?d+'d ':'')+(h?h+'h ':'')+(x%60)+'m'};
  let h;
  if(dow>0&&dow<6&&m>=O&&m<C)h='<span style="color:#6ee7b7">●</span> US market open · closes in '+f(C-m);
  else{let w;if(dow>0&&dow<6&&m<O)w=O-m;else{let n=1,d=(dow+1)%7;while(d===0||d===6){n++;d=(d+1)%7}w=1440-m+(n-1)*1440+O}h='<span style="color:#fca5a5">●</span> US market closed · opens in '+f(w)}
  if($('mk').innerHTML!==h)$('mk').innerHTML=h;
}
const ETF=[['VOO','Vanguard S&P 500'],['VEU','Vanguard FTSE All-World ex-US']],prev={};
function tween(el,to,key){const from=prev[key]??to;prev[key]=to;const t0=performance.now();(function f(t){const x=Math.min(1,(t-t0)/700),v=from+(to-from)*(1-Math.pow(1-x,3));el.textContent='$'+v.toFixed(2);if(x<1)requestAnimationFrame(f)})(t0)}
async function stocks(){
  const k=cfg().fh,box=$('sl');
  if(!k){box.innerHTML='<div class="sub">Add a free Finnhub key in Settings to see VOO and VEU.</div>';return}
  try{
    const qs=await Promise.all(ETF.map(([s])=>fetch('https://finnhub.io/api/v1/quote?symbol='+s+'&token='+encodeURIComponent(k)).then(r=>{if(!r.ok)throw new Error('Finnhub returned '+r.status);return r.json()})));
    if(!box.querySelector('.s'))box.innerHTML=ETF.map(([s,n],i)=>'<div class="s"><div class="top"><b>'+s+'</b><span class="p" id="p'+i+'"></span></div><div class="top"><span class="sub">'+esc(n)+'</span><span class="ch" id="c'+i+'"></span></div><div class="rg"><i id="r'+i+'"></i></div><div class="top sub"><span id="lo'+i+'"></span><span id="hi'+i+'"></span></div></div>').join('');
    qs.forEach((q,i)=>{
      if(!q||!q.c){$('c'+i).textContent='No data';return}
      tween($('p'+i),q.c,'p'+i);
      const up=q.d>=0,el=$('c'+i);el.style.color=up?'#6ee7b7':'#fca5a5';
      el.textContent=(up?'▲ +':'▼ ')+q.d.toFixed(2)+' ('+(up?'+':'')+q.dp.toFixed(2)+'%)';
      $('lo'+i).textContent='$'+q.l.toFixed(2);$('hi'+i).textContent='$'+q.h.toFixed(2);
      $('r'+i).style.left='calc('+(q.h>q.l?Math.min(100,Math.max(0,(q.c-q.l)/(q.h-q.l)*100)):50)+'% - 6px)';
    });
  }catch(e){box.innerHTML='<div class="err">'+esc(e.message)+(e instanceof TypeError?'\n\nBlocked before Finnhub replied. Check the key, or ask Claude to add a small relay.':'')+'</div>'}
}

/* ---------- bus: timetable + live ---------- */
const OCC=[['Empty',1],['Plenty of seats',1],['Few seats',2],['Standing room only',3],['Very crowded',4],['Full',4],['Not taking passengers',4]],COL=['#6ee7b7','#6ee7b7','#fbbf24','#fb923c','#f87171'];
const D={},hist={};let stopPos=null,ST={t:0,rows:null};
const km=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const brg=(a,b,c,d)=>{const r=Math.PI/180,y=Math.sin((d-b)*r)*Math.cos(c*r),x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return(Math.atan2(y,x)/r+360)%360};
const hmt=t=>new Date(t*1000).toLocaleTimeString('en-NZ',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).replace(/\s/g,'').toLowerCase();
const secs=t=>{const m=/^(\d+):(\d+):(\d+)/.exec(t||'');return m?+m[1]*3600+ +m[2]*60+ +m[3]:null};
const hue=r=>{let h=0;for(const ch of r)h=(h*31+ch.charCodeAt(0))%360;return r==='24R'?12:r==='24B'?200:h};
async function at(p){const r=await fetch('https://api.at.govt.nz'+p,{headers:{'Ocp-Apim-Subscription-Key':cfg().at}});if(!r.ok)throw new Error('AT returned '+r.status+' for '+p.split('?')[0]);return r.json()}
const ents=j=>(j&&j.response&&(j.response.entity||j.response.entities))||(j&&(j.entity||j.entities))||[],rows=j=>arr(j.data||j.response);
async function first(paths,ok){let last;for(const p of paths){const n=p.split('?')[0];try{const j=await at(p);if(!ok||ok(j)){D['ok: '+n]='yes';return j}D['empty: '+n]='no data'}catch(e){last=e;D['failed: '+n]=e.message}}throw last||new Error('No data')}
function diag(){$('diag').innerHTML='<summary>Diagnostics</summary><pre>'+esc(Object.entries(D).map(([k,v])=>k+': '+v).join('\n'))+'</pre>'}
async function findStop(){
  const c=cfg(),j=await first(['/gtfs/v3/stops?filter[stop_code]='+encodeURIComponent(c.stop)],j=>rows(j).length),d=rows(j)[0],a=d.attributes||d;
  stopPos={id:a.stop_id||d.id,lat:+a.stop_lat,lon:+a.stop_lon,code:c.stop};
  $('sn').textContent=c.stop;$('sname').textContent=a.stop_name||'';D.stop=stopPos.id;
}
async function timetable(){
  if(ST.rows&&Date.now()-ST.t<240000)return ST.rows;
  const p=aklParts(),hr=Math.floor(nowMin()/60),id=encodeURIComponent(stopPos.id),date=p.year+'-'+p.month+'-'+p.day;
  const j=await first(['/gtfs/v3/stops/'+id+'/stoptrips?filter[date]='+date+'&filter[start_hour]='+hr+'&filter[hour_range]=3','/gtfs/v3/stops/'+id+'/stoptrips'],j=>rows(j).length);
  const mid=Date.now()/1000-nowMin()*60,u=Date.UTC(+p.year,+p.month-1,+p.day),R=rows(j);
  ST.rows=R.map(r=>{const a=r.attributes||r,s=secs(a.arrival_time||a.departure_time),tid=a.trip_id||(r.relationships&&r.relationships.trip&&r.relationships.trip.data&&r.relationships.trip.data.id),sd=a.service_date,off=/^\d{4}-\d\d-\d\d/.test(sd||'')?(Date.UTC(+sd.slice(0,4),+sd.slice(5,7)-1,+sd.slice(8,10))-u)/1000:0;
    return {route:String(a.route_id||'').split('-')[0].toUpperCase(),trip:tid?String(tid).split('-')[0]:null,at:s==null?null:mid+off+s,seq:a.stop_sequence==null?null:+a.stop_sequence}}).filter(r=>r.at);
  D['timetable rows']=ST.rows.length;D['timetable trip ids']=ST.rows.some(r=>r.trip)?'yes':'no (matching by order)';D['timetable routes']=[...new Set(ST.rows.map(r=>r.route))].join(' ');D['timetable fields']=Object.keys(R[0].attributes||R[0]).join(',');
  ST.t=Date.now();return ST.rows;

async function buses(){
  const c=cfg(),err=$('err');err.innerHTML='';
  if(!c.at){$('bl').innerHTML='<div class="note">Add your free Auckland Transport key in Settings (the small gear at the bottom right) to see live buses.</div>';return}
  try{
    if(!stopPos||stopPos.code!==c.stop){await findStop();ST.rows=null}
    const E=ents(await first(['/realtime/legacy'],j=>ents(j).length)),trips={};
    E.forEach(e=>{const t=e.trip_update,v=e.vehicle,td=(t&&t.trip)||(v&&v.trip),id=td&&td.trip_id;if(!id)return;const k=id.split('-')[0],o=trips[k]||(trips[k]={});if(t)o.tu=t;if(v)o.v=v;if(!o.td||td.route_id)o.td=td});
    const want=c.routes.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),live=[];
    Object.entries(trips).forEach(([k,o])=>{
      const route=String((o.td&&o.td.route_id)||'').split('-')[0].toUpperCase();
      if(want.length&&!want.includes(route)||(o.td&&o.td.schedule_relationship===3))return;
      const su=arr(o.tu&&o.tu.stop_time_update)[0]||{},dl=(o.tu&&o.tu.delay)??(su.arrival&&su.arrival.delay)??(su.departure&&su.departure.delay),pos=o.v&&o.v.position;
      let d=null,st='unk',c0=null;
      if(pos){
        const la=+pos.latitude,lo=+pos.longitude;d=km(stopPos.lat,stopPos.lon,la,lo);
        const vid=(o.v.vehicle&&o.v.vehicle.id)||k,ts=+o.v.timestamp||Date.now()/1000,h=hist[vid];c0=h?h.c:null;
        if(!h)hist[vid]={d,t:ts,c:null};else if(ts>h.t){c0=(h.d-d)*1000/(ts-h.t);hist[vid]={d,t:ts,c:c0}}
        if(c0!=null&&Math.abs(c0)>.8)st=c0>0?'in':'out';
        else if(pos.bearing!=null&&pos.bearing!==''&&!isNaN(+pos.bearing))st=Math.abs(((+pos.bearing-brg(la,lo,stopPos.lat,stopPos.lon))+540)%360-180)<90?'in':'out';
      }
      live.push({k,route,v:o.v,dist:d,st,c0,seq:su.stop_sequence==null?null:+su.stop_sequence,late:dl});
    });
    let tt=null;try{tt=await timetable()}catch(e){D.timetable='unavailable: '+e.message}
    const now=Date.now()/1000,out=[];
    if(tt){
      const byTrip=Object.fromEntries(live.map(l=>[l.k,l])),pool={};
      live.filter(l=>l.st!=='out'&&l.dist!=null&&l.dist<6).sort((a,b)=>a.dist-b.dist).forEach(l=>(pool[l.route]=pool[l.route]||[]).push(l));
      tt.filter(r=>(!want.length||want.includes(r.route))&&r.at>now-300&&r.at<now+7500).sort((a,b)=>a.at-b.at).forEach(r=>{
        let l=r.trip?byTrip[r.trip]:null;
        if(!l&&!r.trip&&pool[r.route]&&pool[r.route].length)l=pool[r.route].shift();
        const m=(r.at+(l&&l.late!=null?l.late:0)-now)/60;
        if(m<-1||(!l&&m<0)||m>120)return;
        out.push({route:r.route,mins:Math.max(0,Math.round(m)),sched:r.at,live:!!l,late:l?l.late:null,away:l&&l.seq!=null&&r.seq!=null?r.seq-l.seq:null,v:l&&l.v});
      });
    }else live.filter(l=>l.dist!=null&&l.dist<6&&l.st!=='out').forEach(l=>{const sp=l.c0>.8?Math.min(12,Math.max(3,l.c0)):6;out.push({route:l.route,mins:Math.round(l.dist*1000/sp/60),live:true,approx:1,late:l.late,v:l.v})});
    out.sort((a,b)=>a.mins-b.mins);
    let shown;
    if(want.length){const per=Math.max(1,Math.floor(4/want.length));shown=[];want.forEach(r=>{const l=out.filter(x=>x.route===r).slice(0,per);shown.push(...(l.length?l:[{route:r,none:1,mins:99999}]))});shown.sort((a,b)=>a.mins-b.mins)}else shown=out.slice(0,4);
    const base=String(stopPos.id).split('-')[0],al=[];
    E.forEach(e=>{const a=e.alert;if(!a)return;if(arr(a.informed_entity).some(x=>(x.route_id&&want.includes(String(x.route_id).split('-')[0].toUpperCase()))||(x.stop_id&&String(x.stop_id).split('-')[0]===base))){const h=arr(a.header_text&&a.header_text.translation)[0],d=arr(a.description_text&&a.description_text.translation)[0];if(h&&h.text&&!al.some(z=>z.h===h.text))al.push({h:h.text,d:d&&d.text&&d.text!==h.text?d.text.slice(0,220):''})}});
    setItems('al',al.length?al:[{ok:1,routes:want.join(' / ')||'this stop'}]);
    const sm=Object.values(trips).find(o=>o.td);
    Object.assign(D,{'live items':E.length,'live trips on your routes':live.length,'due per route':want.map(r=>r+':'+out.filter(x=>x.route===r).length).join(' '),'alerts in feed':E.filter(e=>e.alert).length,'alerts for you':al.length,mode:tt?'timetable + live':'live position only','live trip sample':sm?JSON.stringify(sm.td):'none'});diag();
    $('bl').innerHTML=shown.length?shown.map(b=>{
      const pill='<b style="background:hsl('+hue(b.route)+' 90% 70%)">'+esc(b.route)+'</b>';
      if(b.none)return '<div class="b none">'+pill+'<span class="e">—</span><i>No bus due in the next 2 hours</i></div>';
      let occ='No crowding data',lvl=0;
      if(b.v&&b.v.occupancy_status!=null){const o=b.v.occupancy_status,i=typeof o==='number'?o:['EMPTY','MANY_SEATS_AVAILABLE','FEW_SEATS_AVAILABLE','STANDING_ROOM_ONLY','CRUSHED_STANDING_ROOM_ONLY','FULL','NOT_ACCEPTING_PASSENGERS'].indexOf(o);if(OCC[i]){occ=OCC[i][0];lvl=OCC[i][1]}}
      const bd=b.late==null?'':Math.abs(b.late)<60?'<span class="bd" style="color:#7ef0c3">On time</span>':b.late>0?'<span class="bd" style="color:#fcd34d">'+Math.round(b.late/60)+' min late</span>':'<span class="bd" style="color:#7dd3fc">'+Math.round(-b.late/60)+' min early</span>';

      return '<div class="b">'+pill+'<span class="e">'+(b.mins<1?'Due':(b.approx?'~':'')+b.mins+'<small>min</small>')+'</span><i>'+(b.sched?hmt(b.sched)+' · ':'')+(b.live?'<span class="lv">● live</span>':'scheduled')+bd+aw+'</i>'
        +(b.v?'<div class="m"><div>'+seg+'</div><span>'+occ+'</span></div>':'')+'</div>';

  }catch(e){err.innerHTML='<div class="err">'+esc(e.message)+(e instanceof TypeError?'\n\nBlocked before AT replied (often CORS, or a wrong key). Ask Claude to add a small relay.':'')+'</div>';diag()}
}
