  const r=RT[key],it=r.items[r.i];if(it===undefined)return;const box=$(r.box);
  [...box.children].forEach(o=>{if(!o.classList.contains('fi'))return;if(o.classList.contains('out'))o.remove();else{o.classList.add('out');setTimeout(()=>o.remove(),1100)}});
  const n=document.createElement('div');n.className='fi';n.innerHTML=r.render(it,r.i,r.items.length);box.appendChild(n);

function sunCalc(){
  const p=aklParts(),N=Math.floor((Date.UTC(+p.year,+p.month-1,+p.day)-Date.UTC(+p.year,0,0))/864e5),R=Math.PI/180,lat=-36.85*R,lh=174.76/15,u=new Date();
  const off=(((nowMin()-(u.getUTCHours()*60+u.getUTCMinutes()+u.getUTCSeconds()/60))+600)%1440+1440)%1440-600;
  const f=up=>{const t=N+((up?6:18)-lh)/24,M=.9856*t-3.289,L=((M+1.916*Math.sin(M*R)+.02*Math.sin(2*M*R)+282.634)%360+360)%360;
    let RA=Math.atan(.91764*Math.tan(L*R))/R;RA=(RA%360+360)%360;RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90;RA/=15;
    const sd=.39782*Math.sin(L*R),ch=(Math.cos(90.833*R)-sd*Math.sin(lat))/(Math.cos(Math.asin(sd))*Math.cos(lat)),H=(up?360-Math.acos(ch)/R:Math.acos(ch)/R)/15,T=H+RA-.06571*t-6.622;
    return Math.round((((((T-lh)%24)+24)%24)*60+off)%1440);};
  return [f(true),f(false)];
}

  if(!c.at){draw('<div class="bk"><div class="sv none">Add your free AT key in Settings (the gear in the island).</div></div>');return}
  try{
    if(!stopPos||stopPos.code!==c.stop){await findStop();ST.rows=null}
    const want=c.routes.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
    const E=ents(await first(['/realtime/legacy'],j=>ents(j).length)),trips={};
    E.forEach(e=>{const t=e.trip_update,v=e.vehicle,td=(t&&t.trip)||(v&&v.trip),id=td&&td.trip_id;if(!id)return;const k=id.split('-')[0],o=trips[k]||(trips[k]={});if(t)o.tu=t;if(v)o.v=v;if(!o.td||td.route_id)o.td=td});
    const live=[];
    Object.entries(trips).forEach(([k,o])=>{
      const route=String((o.td&&o.td.route_id)||'').split('-')[0].toUpperCase();
      if(want.length&&!want.includes(route)||(o.td&&o.td.schedule_relationship===3))return;
      const su=arr(o.tu&&o.tu.stop_time_update)[0]||{},dl=(o.tu&&o.tu.delay)??(su.arrival&&su.arrival.delay)??(su.departure&&su.departure.delay),pos=o.v&&o.v.position;
      let d=null,st='unk',c0=null;
      if(pos){
        const la=+pos.latitude,lo=+pos.longitude;d=km(stopPos.lat,stopPos.lon,la,lo);
        const vid=(o.v.vehicle&&o.v.vehicle.id)||k,ts=+o.v.timestamp||Date.now()/1000,h=hist[vid];c0=h?h.c:null;
        if(!h)hist[vid]={d,t:ts,c:null};else if(ts>h.t){c0=(h.d-d)*1000/(ts-h.t);hist[vid]={d,t:ts,c:c0}}
        if(c0!=null&&Math.abs(c0)>.8)st=c0>0?'in':'out';
        else if(pos.bearing!=null&&pos.bearing!==''&&!isNaN(+pos.bearing))st=Math.abs(((+pos.bearing-brg(la,lo,stopPos.lat,stopPos.lon))+540)%360-180)<90?'in':'out';
      }
      live.push({k,route,v:o.v,dist:d,st,c0,late:dl});
    });
    let tt=null;try{tt=await timetable()}catch(e){D.timetable='unavailable: '+e.message}
    await Promise.all(want.map(routeName));
    const now=Date.now()/1000,out=[];
    if(tt){
      const byTrip=Object.fromEntries(live.map(l=>[l.k,l])),pool={};
      live.filter(l=>l.st!=='out'&&l.dist!=null&&l.dist<6).sort((a,b)=>a.dist-b.dist).forEach(l=>(pool[l.route]=pool[l.route]||[]).push(l));
      tt.filter(r=>(!want.length||want.includes(r.route))&&r.at>now-300&&r.at<now+7500).sort((a,b)=>a.at-b.at).forEach(r=>{
        let l=r.trip?byTrip[r.trip]:null;
        if(!l&&!r.trip&&pool[r.route]&&pool[r.route].length)l=pool[r.route].shift();
        const m=(r.at+(l&&l.late!=null?l.late:0)-now)/60;
        if(m<-1||(!l&&m<0)||m>120)return;
        out.push({route:r.route,mins:Math.max(0,Math.round(m)),sched:r.at,head:r.head,live:!!l,late:l?l.late:null,v:l&&l.v});
      });
    }else live.filter(l=>l.dist!=null&&l.dist<6&&l.st!=='out').forEach(l=>{const sp=l.c0>.8?Math.min(12,Math.max(3,l.c0)):6;out.push({route:l.route,mins:Math.round(l.dist*1000/sp/60),live:true,approx:1,late:l.late,v:l.v})});
    out.sort((a,b)=>a.mins-b.mins);
    const two=out.slice(0,2);
    IS.svc=two.map(x=>x.mins);
    IS.next=two[0]?{route:two[0].route,mins:two[0].mins,st:two[0].late==null?'scheduled':Math.abs(two[0].late)<60?'on time':two[0].late>0?Math.round(two[0].late/60)+' min late':Math.round(-two[0].late/60)+' min early'}:null;
    draw('<div class="bk">'+(two.length?two.map(row).join(''):'<div class="sv none">No '+esc(want.join(' or ')||'bus')+' due in the next 2 hours</div>')+'</div>');
    const base=String(stopPos.id).split('-')[0],al=[];
    E.forEach(e=>{const a=e.alert;if(!a)return;if(arr(a.informed_entity).some(x=>(x.route_id&&want.includes(String(x.route_id).split('-')[0].toUpperCase()))||(x.stop_id&&String(x.stop_id).split('-')[0]===base))){const h=arr(a.header_text&&a.header_text.translation)[0];if(h&&h.text&&!al.some(z=>z.h===h.text))al.push({h:h.text})}});
    IS.alerts=al.length?al:[{ok:1,routes:want.join(' / ')||'this stop'}];
    const fresh=al.find(a=>!SEEN.has(a.h));al.forEach(a=>SEEN.add(a.h));if(fresh)notify('al-'+hash(fresh.h),{ic:'⚠️',g:GR.alert,t:'Service alert',b:fresh.h.slice(0,150)},{pri:1,cool:24*HR,ms:11000});
    const A=two[0];if(A&&A.live&&A.mins<=1){const k=A.route+'|'+Math.floor(now/600);if(k!==dueKey){dueKey=k;notify('bus-'+A.route,{ic:'🚌',g:GR.bus,t:A.route+' arriving now',b:(A.head||RN[A.route]||'Your stop')+(A.late>60?' · running late':'')},{cool:45*60000})}}
    ilRefresh('l');ilRefresh('a');
    D['live trips on your routes']=live.length;D['due per route']=want.map(r=>r+':'+out.filter(x=>x.route===r).length).join(' ');D['alerts for you']=al.length;D.mode=tt?'timetable + live':'live position only';
  }catch(e){draw('<div class="bk"><div class="sv none" style="color:#ffb4b4">'+esc(e.message)+(e instanceof TypeError?' (blocked before AT replied; often a wrong key or CORS)':'')+'</div></div>')}
}

/* ---------- glue ---------- */
document.querySelectorAll('.g,#isl').forEach(g=>{
  g.addEventListener('pointermove',e=>{const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px');g.classList.add('lit')},{passive:true});
  g.addEventListener('pointerleave',()=>g.classList.remove('lit'));
});
$('upd').onclick=()=>diag();
const openSet=()=>{const c=cfg();$('k1').value=c.at;$('k3').value=c.fh;$('k4').value=c.stop;$('k5').value=c.routes;$('k7').value=c.walk;$('k8').value=LS.g('dimOn','22:00');$('k9').value=LS.g('dimOff','05:30');$('dlg').showModal()};
$('gear').onclick=openSet;$('ngear').onclick=openSet;
$('cx').onclick=()=>$('dlg').close();
$('sv').onclick=()=>{LS.s('at',$('k1').value.trim());LS.s('fh',$('k3').value.trim());LS.s('stop',$('k4').value.trim()||'8274');LS.s('routes',$('k5').value);LS.s('walk',$('k7').value.trim()||'4');LS.s('dimOn',$('k8').value);LS.s('dimOff',$('k9').value);$('dlg').close();dimCalc();stopPos=null;buses();stocks(true)};
function diag(){$('dgp').textContent=Object.entries(D).map(([k,v])=>k+': '+v).join('\n')||'No diagnostics yet.';$('dg2').showModal()}
$('dgc').onclick=()=>$('dg2').close();
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{setK();fxSize();fxStart();refitAll();ilRefreshAll()},200)});
fxSize();tick();schedTick();ilInit();minuteChecks();
const later=(f,ms)=>setTimeout(f,ms);   /* every data source starts at a different moment, so work never piles up */
later(()=>{weather();setInterval(weather,6e5)},300);
later(()=>{stocks(true);setInterval(()=>{if(!document.hidden&&!DM.on)stocks()},6e4)},1700);
later(()=>{buses();setInterval(()=>{if(!document.hidden&&!DM.on)buses()},3e4)},3100);
later(()=>{news();setInterval(news,9e5)},4500);
later(()=>{valData();setInterval(()=>{if(!document.hidden&&!DM.on)valData()},3e5)},5900);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf)}else{fxStart();tick();later(buses,500);later(()=>stocks(),1700);later(weather,2900);later(valData,4100)}});
</script>
