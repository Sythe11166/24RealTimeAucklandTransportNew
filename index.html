/* ---------- rotators + auto-fit ---------- */
function fitBox(id,max,min=10){const b=$(id),f=b.querySelector('.fit');if(!f)return;let s=max;f.style.fontSize=s+'px';while(s>min&&f.scrollHeight>b.clientHeight+1){s-=1;f.style.fontSize=s+'px'}}
const RT={};
function rotor(key,box,dots,render,ms,o){RT[key]={i:0,items:[],box,dots,render,o:o||{}};setInterval(()=>{if(!document.hidden)step(key,1)},ms)}
function setItems(key,items){const r=RT[key],s=JSON.stringify(items);if(r.s===s)return;const same=r.items.length===items.length;r.s=s;r.items=items;r.i=same?Math.min(r.i,items.length-1):0;paint(key)}
function step(key,d){const r=RT[key];if(r.items.length>1){r.i=(r.i+d+r.items.length)%r.items.length;paint(key)}}
function paint(key){const r=RT[key],it=r.items[r.i];if(it===undefined)return;$(r.box).innerHTML='<div class="fi">'+r.render(it,r.i,r.items.length)+'</div>';$(r.dots).innerHTML=r.items.length>1?r.items.map((_,n)=>'<i'+(n===r.i?' class="on"':'')+'></i>').join(''):'';if(r.o.fit)fitBox(r.box,r.o.fit);if(r.o.after)r.o.after(it)}

/* ---------- quotes with meaning ---------- */
const Q=[["We suffer more often in imagination than in reality.","Seneca","Most of what we dread never happens. Worry rehearses pain in advance, so meet each problem when it actually arrives."],["The unexamined life is not worth living.","Socrates","A life on autopilot misses its point. Question your habits, beliefs and choices so you live on purpose."],["What stands in the way becomes the way.","Marcus Aurelius","Obstacles aren’t detours from the path, they are the path. Treat each setback as material to work with."],["It is not that we have a short time to live, but that we waste much of it.","Seneca","Life is long enough if used well. The real loss is the hours we hand to distraction and delay."],["Nothing endures but change.","Heraclitus","Everything is in motion, so clinging to how things were causes suffering. Adapting is the only stable strategy."],["He who has a why to live can bear almost any how.","Friedrich Nietzsche","A strong purpose makes hardship bearable. Know what you’re living for and the difficulty weighs less."],["Man is condemned to be free.","Jean-Paul Sartre","You can’t escape choosing, so you own the consequences. Even not choosing is a choice."],["The only thing I know is that I know nothing.","Socrates","Wisdom starts with admitting the limits of what you know. Humility keeps you curious and teachable."],["Happiness depends upon ourselves.","Aristotle","Contentment comes from how we act and think, not from luck. Cultivate good habits and character."],["We are what we repeatedly do. Excellence, then, is not an act, but a habit.","Will Durant, on Aristotle","Greatness is built from small daily practices, not one heroic moment. Your routines shape who you become."],["Man is the measure of all things.","Protagoras","Truth and value are judged from human experience and perspective. It invites us to take other viewpoints seriously."],["Wonder is the feeling of a philosopher, and philosophy begins in wonder.","Plato","Curiosity is where deep thinking starts. Stay amazed by ordinary things and the questions keep coming."],["Life must be understood backwards, but it must be lived forwards.","Søren Kierkegaard","Only in hindsight does the pattern make sense, yet you must decide before you know. Act despite uncertainty."],["People are disturbed not by things, but by the views they take of them.","Epictetus","It’s our judgement of events, not the events, that upsets us. Change the interpretation and the distress shrinks."],["The soul becomes dyed with the colour of its thoughts.","Marcus Aurelius","What you repeatedly think shapes your character. Guard your thinking like you’d guard your diet."],["When we are no longer able to change a situation, we are challenged to change ourselves.","Viktor Frankl","Some circumstances can’t be fixed, but our response always can. Growth often begins where control ends."],["I think, therefore I am.","René Descartes","Even if everything else can be doubted, the act of doubting proves a thinker exists. It’s a foundation for certainty."],["Whereof one cannot speak, thereof one must be silent.","Ludwig Wittgenstein","Some things lie beyond what words can clearly say. Be honest about where language and knowledge stop."],["The limits of my language mean the limits of my world.","Ludwig Wittgenstein","What we can name shapes what we can think. A richer vocabulary widens how much of life you can perceive."],["He who fights with monsters should be careful lest he thereby become a monster.","Friedrich Nietzsche","Long battles with something ugly can change you. Watch that fighting an enemy doesn’t make you resemble them."],["It is not the man who has too little, but the man who craves more, that is poor.","Seneca","Wealth is about wanting, not having. Endless desire leaves you poor at any income."],["Waste no more time arguing about what a good man should be. Be one.","Marcus Aurelius","Stop debating virtue and practise it. Character shows in actions, not opinions."],["Freedom is secured not by the fulfilling of one’s desires, but by the removal of desire.","Epictetus","Chasing every want makes you its servant. Wanting less is a faster route to being free."],["Hope is a good breakfast, but it is a bad supper.","Francis Bacon","Optimism fuels a start but can’t sustain the finish. Pair hope with plans and results."],["Attention is the rarest and purest form of generosity.","Simone Weil","Truly focusing on someone, without fixing or judging, is a real gift. Presence costs more than money."],["One must imagine Sisyphus happy.","Albert Camus","Even endless, repetitive effort can hold meaning if you embrace it. Find purpose in the doing, not only the outcome."],["The journey of a thousand miles begins with a single step.","Laozi","Big goals feel overwhelming until you start. Begin with the next small, concrete action."],["Knowing others is intelligence; knowing yourself is true wisdom.","Laozi","Understanding people is clever, but understanding your own motives is deeper. Self-knowledge guides every other decision."],["Real knowledge is to know the extent of one’s ignorance.","Confucius","Knowing what you don’t know marks a true expert. It prevents overconfidence and invites learning."],["Do not weep; do not wax indignant. Understand.","Baruch Spinoza","Rather than react with anger or grief, look for causes. Understanding brings calm and better responses."],["All of humanity’s problems stem from man’s inability to sit quietly in a room alone.","Blaise Pascal","We chase distraction to avoid our own thoughts. Learning to be still can solve more than constant busyness."],["You could leave life right now. Let that determine what you do and say and think.","Marcus Aurelius","Remembering life is finite sharpens priorities. Act today as though it counts, because it does."],["Do not spoil what you have by desiring what you have not.","Epicurus","Dwelling on what’s missing dulls what’s already good. Practise gratitude for what you have now."],["Dare to know! Have the courage to use your own understanding.","Immanuel Kant","Don’t outsource your thinking to authorities or the crowd. Reason for yourself, even when it’s uncomfortable."]];
let qKey=null,qOff=0;
function quote(force){
  const p=aklParts(),day=Math.floor(Date.UTC(+p.year,+p.month-1,+p.day)/864e5),slot=day*8+Math.floor(nowMin()/180),k=slot+'|'+qOff;

}

/* ---------- time, sun, sky ---------- */
let qDay=null,SR=360,SS=1200;
function aklParts(){return Object.fromEntries(new Intl.DateTimeFormat('en-NZ',{timeZone:TZ,hourCycle:'h12',year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit',second:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]))}
function nowMin(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return (+p.hour%24)*60+ +p.minute+ +p.second/60}
function sunCalc(){
  const p=aklParts(),N=Math.floor((Date.UTC(+p.year,+p.month-1,+p.day)-Date.UTC(+p.year,0,0))/864e5),R=Math.PI/180,lat=-36.85*R,lh=174.76/15,u=new Date();
  const off=(((nowMin()-(u.getUTCHours()*60+u.getUTCMinutes()+u.getUTCSeconds()/60))+600)%1440+1440)%1440-600;
  const f=up=>{const t=N+((up?6:18)-lh)/24,M=.9856*t-3.289,L=((M+1.916*Math.sin(M*R)+.02*Math.sin(2*M*R)+282.634)%360+360)%360;
    let RA=Math.atan(.91764*Math.tan(L*R))/R;RA=(RA%360+360)%360;RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90;RA/=15;
    const sd=.39782*Math.sin(L*R),ch=(Math.cos(90.833*R)-sd*Math.sin(lat))/(Math.cos(Math.asin(sd))*Math.cos(lat)),H=(up?360-Math.acos(ch)/R:Math.acos(ch)/R)/15,T=H+RA-.06571*t-6.622;
    return Math.round((((((T-lh)%24)+24)%24)*60+off)%1440);};
  return [f(true),f(false)];
}
function secBar(s){const b=$('tsb');b.style.transition='none';b.style.width=(s/60*100)+'%';void b.offsetWidth;b.style.transition='width '+(60-s)+'s linear';b.style.width='100%'}
function tick(){
  const p=aklParts();
  if($('tn').textContent!==p.minute){$('th').textContent=p.hour;$('tn').textContent=p.minute;const t=$('tm');t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}
  $('ap').textContent=p.dayPeriod||'';
  const day=Math.floor(Date.UTC(+p.year,+p.month-1,+p.day)/864e5);
  if(day!==qDay){qDay=day;$('dt').textContent=new Date().toLocaleDateString('en-NZ',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'});[SR,SS]=sunCalc()}
  if(!tick.n||p.second==='00')secBar(+p.second);
  mkt();quote();if(!tick.n||p.second==='00')skyBg();tick.n=1;island();
}
const DAY={sun:['#79c4f4','#ffe28f','#ff9d5c','#ffd24a','#ff8a3d','#6ec1ff','#fff1a6'],part:['#8cc6ee','#f6e2a8','#f5b27a','#ffd76a','#ffa64d','#9bd3ff','#ffeab4'],cloud:['#aebccd','#d3d9e1','#9aa8ba','#c7d0dc','#95a5b9','#e3e8ee','#eef3fa'],fog:['#bfc5ce','#dcdfe4','#aab1bc','#e7e9ec','#b6bcc6','#cfd4db','#eceff3'],rain:['#6f879d','#8fa3b6','#566b81','#7aa0c0','#5b7c99','#9db4c8','#b5d8f2'],storm:['#3a4256','#4e586d','#232938','#5b4b8a','#3b4f7a','#6b7aa8','#a9a4e8'],snow:['#dbe8f4','#f0f5fa','#bdd0e2','#ffffff','#cfe2f5','#e6eef7','#ffffff']};
const NIGHT={sun:['#02040a','#070f24','#0c1b40','#1c2f7a','#0f3b6b','#35246b','#3f63f0'],part:['#03050c','#0a1228','#101d3c','#1c2f7a','#12406b','#35246b','#3a5ad0'],cloud:['#06080d','#101520','#1a2230','#2a3a55','#233044','#3a4660','#506080'],fog:['#090b10','#151a22','#202733','#2e3a4d','#27313f','#3b4757','#586578'],rain:['#04070c','#0b1420','#142234','#1d3a5c','#16314d','#2a4a6e','#3d6a96'],storm:['#030409','#0a0d17','#141a2a','#3a2f6b','#1f3560','#4a3d80','#6a4fc0'],snow:['#0a0f18','#18202d','#243042','#3b4f6b','#33455f','#566f8f','#7d9cc4']};
const TW={dawn:['#ffb9a0','#ffdca8','#b58cf0','#ff8fa3','#ffb36b','#a58bff','#ffb98e'],dusk:['#ff8b5a','#ff5f7f','#5a3f8e','#ff9a4a','#ff4f6d','#7a56c8','#ff8f5e']};
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>a.map((c,i)=>{const x=hx(c),y=hx(b[i]);return '#'+x.map((v,k)=>Math.round(v+(y[k]-v)*t).toString(16).padStart(2,'0')).join('')});
let WX={kind:'sun',code:0,day:1};
function phasePal(ph){const k=WX.kind,clear=k==='sun'||k==='part';return ph==='night'?NIGHT[k]:ph==='day'?DAY[k]:mix(DAY[k],TW[ph],clear?.8:.4)}
function skyBg(){
  const n=nowMin(),K=[[SR-60,'night'],[SR-5,'dawn'],[SR+50,'day'],[SS-100,'day'],[SS-5,'dusk'],[SS+30,'night']];
  let pal=phasePal('night');const i=K.findIndex(k=>n<k[0]);
  if(i>0){const a=K[i-1],b=K[i];pal=mix(phasePal(a[1]),phasePal(b[1]),(n-a[0])/(b[0]-a[0]))}
  const st=document.documentElement.style,clear=WX.kind==='sun'||WX.kind==='part';
  ['b1','b2','b3','o1','o2','o3','glow'].forEach((k,j)=>st.setProperty('--'+k,pal[j]));

/* ---------- weather effects (canvas) ---------- */
const fxc=$('fx'),fx=fxc.getContext('2d');let FW=0,FH=0,FD=1,FP=[],FM='none',FN=0,FL=0,FT=0,NX=4,raf=0;
function fxSet(m,n){FM=m;FN=n;const k=innerWidth*innerHeight/800000;FP=Array.from({length:Math.round(n*k)},()=>({x:Math.random()*FW,y:Math.random()*FH,v:.6+Math.random()*.8,r:Math.random()}))}

function fxLoop(t){
  const dt=Math.min(.05,(t-FT)/1000||.016);FT=t;fx.clearRect(0,0,FW,FH);
  if(FM==='rain'||FM==='storm'){fx.strokeStyle='rgba(255,255,255,.42)';fx.lineWidth=1.2*FD;fx.beginPath();
    FP.forEach(p=>{const L=(14+p.r*16)*FD,sp=(900+p.v*700)*FD;fx.moveTo(p.x,p.y);fx.lineTo(p.x-L*.18,p.y+L);p.y+=sp*dt;p.x-=sp*dt*.18;if(p.y>FH||p.x<-40){p.y=-L;p.x=Math.random()*FW*1.15}});fx.stroke()}
  else if(FM==='snow'){fx.fillStyle='rgba(255,255,255,.85)';FP.forEach(p=>{fx.beginPath();fx.arc(p.x,p.y,(1.5+p.r*2.5)*FD,0,6.283);fx.fill();p.y+=(40+p.v*50)*FD*dt;p.x+=Math.sin(t/1000*p.v+p.r*10)*22*FD*dt;if(p.y>FH+8){p.y=-8;p.x=Math.random()*FW}})}
  else if(FM==='motes'){FP.forEach(p=>{fx.fillStyle='rgba(255,246,200,'+(.14+p.r*.16)+')';fx.beginPath();fx.arc(p.x,p.y,(2+p.r*6)*FD,0,6.283);fx.fill();p.y-=12*FD*dt*p.v;p.x+=Math.sin(t/2500+p.r*9)*8*FD*dt;if(p.y<-12){p.y=FH+12;p.x=Math.random()*FW}})}
  if(FM==='storm'){NX-=dt;if(NX<=0){FL=1;NX=5+Math.random()*9}FL=Math.max(0,FL-dt*2.2);if(FL>0){fx.fillStyle='rgba(255,255,255,'+FL*.3+')';fx.fillRect(0,0,FW,FH)}}
  raf=requestAnimationFrame(fxLoop);
}
function fxStart(){cancelAnimationFrame(raf);fx.clearRect(0,0,FW,FH);if(FM!=='none'&&!REDUCE&&!document.hidden)raf=requestAnimationFrame(fxLoop)}
function fxFor(c,day,k){return c>=95?['storm',320]:c>=85?['snow',200]:c>=80?['rain',c>=82?320:170]:c>=71&&c<=77?['snow',c>=75?280:140]:c>=66&&c<=67?['rain',200]:c>=61&&c<=65?['rain',c===65?300:c===63?200:120]:c>=51&&c<=57?['rain',70]:k==='sun'&&day?['motes',22]:['none',0]}

  const aw=b.away!=null&&b.away>=0&&b.away<=40?' · '+(b.away===0?'at your stop':b.away+' stop'+(b.away>1?'s':'')+' away'):'';
  const cm=occ?'<div class="cm">'+[1,2,3,4].map(n=>'<u style="background:'+(n<=lvl?COL[lvl]:'')+'"></u>').join('')+'<span>'+occ+'</span></div>':'';
  return '<div class="ar '+cls+'"><b class="pl">'+esc(b.route)+'</b><div class="md"><span class="lb">'+(b.live&&cls==='act'?'<i class="lv"></i>':'')+lab+'</span><span class="in">'+(b.sched?hmt(b.sched)+(b.live?' · live':' · scheduled'):'live estimate')+bd+aw+'</span>'+cm+'</div><div class="mn2">'+(b.mins<1?'Due':(b.approx?'~':'')+b.mins+'<small>min</small>')+'</div></div>';
}
function islandNote(h,ms){$('ix').innerHTML=h;$('isl').classList.add('ex');clearTimeout(islandNote.t);islandNote.t=setTimeout(()=>$('isl').classList.remove('ex'),ms||9000)}
async function buses(){
  const c=cfg(),box=$('bl');
  if(!c.at){box.innerHTML='<div class="bk"><div class="ar none"><div class="md"><span class="lb">Setup</span><span class="in" style="white-space:normal">Add your free AT key in Settings (the gear, bottom right).</span></div></div></div>';return}
  try{
    if(!stopPos||stopPos.code!==c.stop){await findStop();ST.rows=null}
    const E=ents(await first(['/realtime/legacy'],j=>ents(j).length)),trips={};
    E.forEach(e=>{const t=e.trip_update,v=e.vehicle,td=(t&&t.trip)||(v&&v.trip),id=td&&td.trip_id;if(!id)return;const k=id.split('-')[0],o=trips[k]||(trips[k]={});if(t)o.tu=t;if(v)o.v=v;if(!o.td||td.route_id)o.td=td});
    const want=c.routes.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),live=[];
    Object.entries(trips).forEach(([k,o])=>{
      const route=String((o.td&&o.td.route_id)||'').split('-')[0].toUpperCase();
      if(want.length&&!want.includes(route)||(o.td&&o.td.schedule_relationship===3))return;
      const su=arr(o.tu&&o.tu.stop_time_update)[0]||{},dl=(o.tu&&o.tu.delay)??(su.arrival&&su.arrival.delay)??(su.departure&&su.departure.delay),pos=o.v&&o.v.position;
      let d=null,st='unk',c0=null;
      if(pos){
        const la=+pos.latitude,lo=+pos.longitude;d=km(stopPos.lat,stopPos.lon,la,lo);
        const vid=(o.v.vehicle&&o.v.vehicle.id)||k,ts=+o.v.timestamp||Date.now()/1000,h=hist[vid];c0=h?h.c:null;
        if(!h)hist[vid]={d,t:ts,c:null};else if(ts>h.t){c0=(h.d-d)*1000/(ts-h.t);hist[vid]={d,t:ts,c:c0}}
        if(c0!=null&&Math.abs(c0)>.8)st=c0>0?'in':'out';
        else if(pos.bearing!=null&&pos.bearing!==''&&!isNaN(+pos.bearing))st=Math.abs(((+pos.bearing-brg(la,lo,stopPos.lat,stopPos.lon))+540)%360-180)<90?'in':'out';
      }
      live.push({k,route,v:o.v,dist:d,st,c0,seq:su.stop_sequence==null?null:+su.stop_sequence,late:dl});
    });
    let tt=null;try{tt=await timetable()}catch(e){D.timetable='unavailable: '+e.message}
    const now=Date.now()/1000,out=[];
    if(tt){
      const byTrip=Object.fromEntries(live.map(l=>[l.k,l])),pool={};
      live.filter(l=>l.st!=='out'&&l.dist!=null&&l.dist<6).sort((a,b)=>a.dist-b.dist).forEach(l=>(pool[l.route]=pool[l.route]||[]).push(l));
      tt.filter(r=>(!want.length||want.includes(r.route))&&r.at>now-300&&r.at<now+7500).sort((a,b)=>a.at-b.at).forEach(r=>{
        let l=r.trip?byTrip[r.trip]:null;
        if(!l&&!r.trip&&pool[r.route]&&pool[r.route].length)l=pool[r.route].shift();
        const m=(r.at+(l&&l.late!=null?l.late:0)-now)/60;
        if(m<-1||(!l&&m<0)||m>120)return;
        out.push({route:r.route,mins:Math.max(0,Math.round(m)),sched:r.at,live:!!l,late:l?l.late:null,away:l&&l.seq!=null&&r.seq!=null?r.seq-l.seq:null,v:l&&l.v});
      });
    }else live.filter(l=>l.dist!=null&&l.dist<6&&l.st!=='out').forEach(l=>{const sp=l.c0>.8?Math.min(12,Math.max(3,l.c0)):6;out.push({route:l.route,mins:Math.round(l.dist*1000/sp/60),live:true,approx:1,late:l.late,v:l.v})});
    out.sort((a,b)=>a.mins-b.mins);
    let A=out.find(x=>x.live),N;
    if(A)N=out.find(x=>x!==A&&x.mins>=A.mins)||out.find(x=>x!==A);else{A=out[0];N=out[1]}
    IS.act=A||null;
    box.innerHTML='<div class="bk">'+(A?row(A,A.live?'Active bus':'Next service','act')+row(N,A.live?'Next service':'Then','nxt'):'<div class="ar none"><div class="md"><span class="lb">No service</span><span class="in">No '+esc(want.join(' or ')||'bus')+' due in the next 2 hours</span></div></div>')+'</div>';
    const base=String(stopPos.id).split('-')[0],al=[];
    E.forEach(e=>{const a=e.alert;if(!a)return;if(arr(a.informed_entity).some(x=>(x.route_id&&want.includes(String(x.route_id).split('-')[0].toUpperCase()))||(x.stop_id&&String(x.stop_id).split('-')[0]===base))){const h=arr(a.header_text&&a.header_text.translation)[0],d=arr(a.description_text&&a.description_text.translation)[0];if(h&&h.text&&!al.some(z=>z.h===h.text))al.push({h:h.text,d:d&&d.text&&d.text!==h.text?d.text.slice(0,260):''})}});
    setItems('al',al.length?al:[{ok:1,routes:want.join(' / ')||'this stop'}]);
    const fresh=al.find(a=>!SEEN.has(a.h));al.forEach(a=>SEEN.add(a.h));if(fresh)islandNote('⚠︎ Service alert · '+esc(fresh.h.slice(0,120)),10000);
    if(A&&A.live&&A.mins<=1){const k=A.route+'|'+A.sched;if(k!==dueKey){dueKey=k;islandNote('🚌 '+esc(A.route)+' is arriving now',8000)}}
    const sm=Object.values(trips).find(o=>o.td);
    Object.assign(D,{'live items':E.length,'live trips on your routes':live.length,'due per route':want.map(r=>r+':'+out.filter(x=>x.route===r).length).join(' '),'alerts in feed':E.filter(e=>e.alert).length,'alerts for you':al.length,mode:tt?'timetable + live':'live position only','live trip sample':sm?JSON.stringify(sm.td):'none'});
  }catch(e){box.innerHTML='<div class="bk"><div class="ar none"><div class="md"><span class="lb" style="color:#ffb4b4">Bus data</span><span class="in" style="white-space:normal">'+esc(e.message)+(e instanceof TypeError?' (blocked before AT replied; often a wrong key or CORS)':'')+'</span></div></div></div>'}
}

/* ---------- dynamic island ---------- */
function island(){
  const t=(id,h)=>{const e=$(id);if(e.dataset.h!==h){e.dataset.h=h;e.innerHTML=h;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}};
  t('ir',(BUSY?'<span class="sp"></span>':'<span class="ok2"></span>')+'<span>'+(LR?'Updated '+hmt(LR/1000):'Loading…')+'</span>');
  const w=IS.W;t('iw',w?ic(w.kind,w.day)+'<b>'+w.t+'°</b>':'');
  const a=IS.act;t('ibus',a?'<i class="yp">'+esc(a.route)+'</i><b>'+(a.mins<1?'Due':(a.approx?'~':'')+a.mins+' min')+'</b>':'');
  const q=IS.qs[0];t('imk',q&&q.q&&q.q.c?'<b>'+q.s+'</b><span class="'+(q.q.d>=0?'up':'dn')+'">'+(q.q.d>=0?'▲ +':'▼ ')+q.q.dp.toFixed(2)+'%</span>':'');
  const v=IS.vc;if(v){const mn=Math.round((v.ts-Date.now())/6e4);t('ivl','<b style="color:#ff4655">VCT</b><span>'+esc(v.a)+' v '+esc(v.b)+' · '+(mn<=0?'live':mn>=60?Math.floor(mn/60)+'h '+(mn%60)+'m':mn+'m')+'</span>')}else t('ivl','');
  const m=nowMin(),s=m<SR?['Sunrise',SR]:m<SS?['Sunset',SS]:['Sunrise',SR];t('isn','<svg class="wi" viewBox="0 0 64 64">'+SUN('translate(0,0) scale(1)')+'</svg><span>'+s[0]+' '+fmtM(s[1])+'</span>');
}
