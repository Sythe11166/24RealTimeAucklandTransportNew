<style>

main{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:1fr 1.5fr .8fr;grid-template-areas:"t t t t w w w w w w w w" "b b b b b b b b s s s s" "u u u u q q q q q q q q";padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

@media(orientation:portrait){main{grid-template-rows:.7fr .85fr 1.7fr .85fr .6fr;grid-template-areas:"t t t t t t u u u u u u" "w w w w w w w w w w w w" "b b b b b b b b b b b b" "s s s s s s s s s s s s" "q q q q q q q q q q q q"}#sl{display:grid;grid-template-columns:1fr 1fr;gap:24px}.s{border:0!important;padding:0!important}}

.g{position:relative;isolation:isolate;min-height:0;overflow:hidden auto;scrollbar-width:none;border-radius:26px;padding:clamp(14px,1.8vw,22px);background:linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,.04));backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,6,24,.5)}
.g::-webkit-scrollbar{display:none}
.g::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.45;transition:opacity .3s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,-30%),rgba(255,255,255,.22),transparent 65%),radial-gradient(60% 80% at 100% 100%,var(--tint,transparent),transparent)}

@keyframes sh{to{background-position:-300% 0}}
h2{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
button{font:inherit;color:var(--t);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 16px;min-height:44px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.s .ch{font-size:13px;font-variant-numeric:tabular-nums}
.rg{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin:10px 0 4px}

#gear{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));padding:6px 14px;min-height:44px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(prefers-reduced-motion:reduce){.o,.stars,.g::after,#qt{animation:none}}

<body>
<div class="o"></div><div class="o"></div><div class="o"></div><div class="stars"></div>
<main>
  <section class="g" id="time"><h2>Auckland</h2><div class="clk"><span id="hm">--:--</span><small id="sc"></small><small id="ap"></small></div><div id="dt"></div></section>
  <section class="g" id="wx"><h2>Weather</h2><div class="wrap"><div class="now"><div id="wi"></div><div><div class="big" id="wt">--</div><div class="sub" id="wd">Loading…</div></div></div><div><svg id="cv" viewBox="0 0 600 34" preserveAspectRatio="none"></svg><div class="hrs" id="hrs"></div></div></div></section>

<button id="gear" aria-label="Settings">Settings</button>

  <h3 style="margin:0">Settings</h3><div class="sub">Saved only on this device.</div>
  <label for="k1">AT API key (dev-portal.at.govt.nz)</label><input id="k1" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">

<script>
const $=id=>document.getElementById(id),TZ='Pacific/Auckland',arr=x=>x==null?[]:Array.isArray(x)?x:[x];
const LS={g(k,d=''){try{return localStorage.getItem(k)??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cfg=()=>({at:LS.g('at'),fh:LS.g('fh'),stop:LS.g('stop','8274'),routes:LS.g('routes','24R,24B')});
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- quotes ---------- */
const Q=[["We suffer more often in imagination than in reality.","Seneca"],["The unexamined life is not worth living.","Socrates"],["What stands in the way becomes the way.","Marcus Aurelius"],["It is not that we have a short time to live, but that we waste much of it.","Seneca"],["Nothing endures but change.","Heraclitus"],["He who has a why to live can bear almost any how.","Friedrich Nietzsche"],["Man is condemned to be free.","Jean-Paul Sartre"],["The only thing I know is that I know nothing.","Socrates"],["Happiness depends upon ourselves.","Aristotle"],["We are what we repeatedly do. Excellence, then, is not an act, but a habit.","Will Durant, on Aristotle"],["Man is the measure of all things.","Protagoras"],["Wonder is the feeling of a philosopher, and philosophy begins in wonder.","Plato"],["Life must be understood backwards, but it must be lived forwards.","Søren Kierkegaard"],["People are disturbed not by things, but by the views they take of them.","Epictetus"],["The soul becomes dyed with the colour of its thoughts.","Marcus Aurelius"],["When we are no longer able to change a situation, we are challenged to change ourselves.","Viktor Frankl"],["I think, therefore I am.","René Descartes"],["Whereof one cannot speak, thereof one must be silent.","Ludwig Wittgenstein"],["The limits of my language mean the limits of my world.","Ludwig Wittgenstein"],["He who fights with monsters should be careful lest he thereby become a monster.","Friedrich Nietzsche"],["It is not the man who has too little, but the man who craves more, that is poor.","Seneca"],["Waste no more time arguing about what a good man should be. Be one.","Marcus Aurelius"],["Freedom is secured not by the fulfilling of one’s desires, but by the removal of desire.","Epictetus"],["Hope is a good breakfast, but it is a bad supper.","Francis Bacon"],["Attention is the rarest and purest form of generosity.","Simone Weil"],["One must imagine Sisyphus happy.","Albert Camus"],["The journey of a thousand miles begins with a single step.","Laozi"],["Knowing others is intelligence; knowing yourself is true wisdom.","Laozi"],["Real knowledge is to know the extent of one’s ignorance.","Confucius"],["Do not weep; do not wax indignant. Understand.","Baruch Spinoza"],["All of humanity’s problems stem from man’s inability to sit quietly in a room alone.","Blaise Pascal"],["You could leave life right now. Let that determine what you do and say and think.","Marcus Aurelius"],["Do not spoil what you have by desiring what you have not.","Epicurus"],["Dare to know! Have the courage to use your own understanding.","Immanuel Kant"]];

/* ---------- clock, sun, sky ---------- */
let qDay=null,SR=360,SS=1200;
function aklParts(){return Object.fromEntries(new Intl.DateTimeFormat('en-NZ',{timeZone:TZ,hourCycle:'h12',year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit',second:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]))}
function nowMin(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return (+p.hour%24)*60+ +p.minute+ +p.second/60}
function sunCalc(){
  const p=aklParts(),N=Math.floor((Date.UTC(+p.year,+p.month-1,+p.day)-Date.UTC(+p.year,0,0))/864e5),R=Math.PI/180,lat=-36.85*R,lh=174.76/15,u=new Date();
  const off=(((nowMin()-(u.getUTCHours()*60+u.getUTCMinutes()+u.getUTCSeconds()/60))+600)%1440+1440)%1440-600;
  const f=up=>{const t=N+((up?6:18)-lh)/24,M=.9856*t-3.289,L=((M+1.916*Math.sin(M*R)+.02*Math.sin(2*M*R)+282.634)%360+360)%360;
    let RA=Math.atan(.91764*Math.tan(L*R))/R;RA=(RA%360+360)%360;RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90;RA/=15;
    const sd=.39782*Math.sin(L*R),ch=(Math.cos(90.833*R)-sd*Math.sin(lat))/(Math.cos(Math.asin(sd))*Math.cos(lat)),H=(up?360-Math.acos(ch)/R:Math.acos(ch)/R)/15,T=H+RA-.06571*t-6.622;
    return Math.round((((((T-lh)%24)+24)%24)*60+off)%1440);};
  return [f(true),f(false)];
}
function tick(){
  const p=aklParts();
  $('hm').textContent=p.hour+':'+p.minute;$('sc').textContent=':'+p.second;$('ap').textContent=(p.dayPeriod||'').toLowerCase();
  const day=Math.floor(Date.UTC(+p.year,+p.month-1,+p.day)/864e5);
  if(day!==qDay){
    qDay=day;$('dt').textContent=new Date().toLocaleDateString('en-NZ',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'});
    const q=Q[day%Q.length],el=$('qt');el.style.animation='none';el.offsetWidth;el.style.animation='';
    el.textContent='“'+q[0]+'”';$('qa').textContent=q[1];
    [SR,SS]=sunCalc();const f=t=>{const h=Math.floor(t/60);return (h%12||12)+':'+String(t%60).padStart(2,'0')+(h<12?'am':'pm')};
    $('sr').textContent='↑ '+f(SR);$('ss').textContent='↓ '+f(SS);
  }
  mkt();if(!tick.n||p.second==='00'){skyBg();arc()}tick.n=1;
}
function arc(){
  const n=nowMin(),f=Math.min(1,Math.max(0,(n-SR)/(SS-SR))),a=Math.PI*(1-f),x=150+120*Math.cos(a),y=100-80*Math.sin(a),day=n>=SR&&n<=SS,A='M30 100A120 80 0 0 1 270 100';
  $('arc').innerHTML='<path d="'+A+'" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2" stroke-dasharray="3 6"/><path d="'+A+'" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" pathLength="1" stroke-dasharray="'+f+' 1" opacity=".85"/><path d="M10 100H290" stroke="rgba(255,255,255,.25)"/>'+(day?'<circle cx="'+x+'" cy="'+y+'" r="14" fill="#fbbf24" opacity=".25"/><circle cx="'+x+'" cy="'+y+'" r="7" fill="#fde68a"/>':'<circle cx="'+(n<SR?30:270)+'" cy="100" r="5" fill="#c3d2e8"/>');
}
const PAL={night:['#0b1c3d','#071430','#040b1a','#1d4ed8','#0e7490','#4338ca'],dawn:['#3d3b86','#8a5a8f','#1a2a55','#f472b6','#fb923c','#6366f1'],day:['#1d4a8f','#2860a8','#12366c','#38bdf8','#7dd3fc','#2563eb'],dusk:['#4a3a85','#b9573f','#22305f','#fb923c','#f43f5e','#7c3aed']};
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>a.map((c,i)=>{const x=hx(c),y=hx(b[i]);return '#'+x.map((v,k)=>Math.round(v+(y[k]-v)*t).toString(16).padStart(2,'0')).join('')});
function skyBg(){
  const n=nowMin(),K=[[SR-60,'night'],[SR-5,'dawn'],[SR+50,'day'],[SS-100,'day'],[SS-5,'dusk'],[SS+30,'night']];
  let pal=PAL.night;const i=K.findIndex(k=>n<k[0]);
  if(i>0){const a=K[i-1],b=K[i];pal=mix(PAL[a[1]],PAL[b[1]],(n-a[0])/(b[0]-a[0]))}
  const st=document.documentElement.style;['b1','b2','b3','o1','o2','o3'].forEach((k,j)=>st.setProperty('--'+k,pal[j]));
  st.setProperty('--stars',n<SR-30||n>SS+20?1:n<SR+30?(SR+30-n)/60:n>SS-10?(n-SS+10)/30:0);
}

/* ---------- weather ---------- */
const P='stroke-linecap="round" stroke-linejoin="round"',CL='<path d="M7 17h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 10.5 3.3 3.3 0 0 0 7 17z"/>';
const IC={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',cloud:CL,part:'<circle cx="8" cy="8" r="3"/><path d="M8 2v1M2 8h1M3.8 3.8l.7.7M12.2 3.8l-.7.7"/><path d="M9 20h8a3.5 3.5 0 0 0 .5-7A5 5 0 0 0 8 14a3 3 0 0 0 1 6z"/>',rain:CL+'<path d="M8 20l1-2M12 21l1-2M16 20l1-2"/>',snow:CL+'<path d="M8 20h.01M12 21h.01M16 20h.01"/>',storm:CL+'<path d="M12 13l-2 4h3l-1 4"/>',fog:'<path d="M4 8h16M6 12h12M8 16h8"/>'};
const icon=(k,day)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" '+P+'>'+IC[k==='sun'&&!day?'moon':k==='part'&&!day?'cloud':k]+'</svg>';
const kind=c=>c===0?'sun':c<3?'part':c===3?'cloud':c<50?'fog':c<70?'rain':c<80?'snow':c<83?'rain':c<90?'snow':'storm';
const LAB={sun:'Clear',part:'Partly cloudy',cloud:'Overcast',fog:'Fog',rain:'Rain',snow:'Snow',storm:'Thunderstorms'};
const TINT={sun:'rgba(251,191,36,.18)',part:'rgba(125,211,252,.16)',cloud:'rgba(148,163,184,.16)',fog:'rgba(148,163,184,.16)',rain:'rgba(56,189,248,.2)',snow:'rgba(224,242,254,.18)',storm:'rgba(167,139,250,.22)'};
async function weather(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-36.85&longitude=174.76&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,precipitation_probability,weather_code,is_day&timezone=Pacific%2FAuckland&forecast_hours=8&wind_speed_unit=kmh');
    if(!r.ok)throw new Error(r.status);
    const j=await r.json(),c=j.current,k=kind(c.weather_code);
    $('wi').innerHTML=icon(k,c.is_day);$('wt').textContent=Math.round(c.temperature_2m)+'°';
    $('wd').textContent=(k==='sun'&&!c.is_day?'Clear night':LAB[k])+' · feels '+Math.round(c.apparent_temperature)+'° · '+Math.round(c.wind_speed_10m)+' km/h';
    $('wx').style.setProperty('--tint',TINT[k]);
    const h=j.hourly;let i=h.time.findIndex(t=>t>c.time);if(i<0)i=1;
    const idx=[0,1,2,3,4,5].map(n=>i+n).filter(n=>n<h.time.length);
    $('hrs').innerHTML=idx.map(n=>{const hr=+h.time[n].slice(11,13),lab=(hr%12||12)+(hr<12?'am':'pm'),pp=h.precipitation_probability[n];
      return '<div><span class="sub">'+lab+'</span>'+icon(kind(h.weather_code[n]),h.is_day[n])+'<span>'+Math.round(h.temperature_2m[n])+'°</span><span class="r">'+(pp>=10?pp+'%':'')+'</span></div>'}).join('');
    const t=idx.map(n=>h.temperature_2m[n]),lo=Math.min(...t),hi=Math.max(...t),sp=Math.max(hi-lo,1);
    $('cv').innerHTML='<path d="M'+t.map((v,n)=>((n+.5)/t.length*600).toFixed(1)+' '+(30-(v-lo)/sp*26).toFixed(1)).join(' L')+'" fill="none" stroke="#7dd3fc" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>';
  }catch(e){$('wd').textContent='Weather unavailable ('+e.message+')'}
}

/* ---------- US market countdown + quotes ---------- */
function mkt(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),m=(+p.hour%24)*60+ +p.minute,O=570,C=960;
  const f=x=>{x=Math.round(x);const d=Math.floor(x/1440),h=Math.floor(x%1440/60);return (d?d+'d ':'')+(h?h+'h ':'')+(x%60)+'m'};
  let h;
  if(dow>0&&dow<6&&m>=O&&m<C)h='<span style="color:var(--up)">●</span> US market open · closes in '+f(C-m);
  else{let w;if(dow>0&&dow<6&&m<O)w=O-m;else{let n=1,d=(dow+1)%7;while(d===0||d===6){n++;d=(d+1)%7}w=1440-m+(n-1)*1440+O}h='<span style="color:var(--dn)">●</span> US market closed · opens in '+f(w)}
  if($('mk').innerHTML!==h)$('mk').innerHTML=h;
}
const ETF=[['VOO','Vanguard S&P 500'],['VEU','Vanguard FTSE All-World ex-US']],prev={};
function tween(el,to,key){const from=prev[key]??to;prev[key]=to;const t0=performance.now();(function f(t){const x=Math.min(1,(t-t0)/700),v=from+(to-from)*(1-Math.pow(1-x,3));el.textContent='$'+v.toFixed(2);if(x<1)requestAnimationFrame(f)})(t0)}
async function stocks(){
  const k=cfg().fh,box=$('sl');
  if(!k){box.innerHTML='<div class="sub">Add a free Finnhub key in Settings to see VOO and VEU.</div>';return}
  try{
    const qs=await Promise.all(ETF.map(([s])=>fetch('https://finnhub.io/api/v1/quote?symbol='+s+'&token='+encodeURIComponent(k)).then(r=>{if(!r.ok)throw new Error('Finnhub returned '+r.status);return r.json()})));
    if(!box.querySelector('.s'))box.innerHTML=ETF.map(([s,n],i)=>'<div class="s"><div class="top"><b>'+s+'</b><span class="p" id="p'+i+'"></span></div><div class="top"><span class="sub">'+esc(n)+'</span><span class="ch" id="c'+i+'"></span></div><div class="rg"><i id="r'+i+'"></i></div><div class="top sub"><span id="lo'+i+'"></span><span id="hi'+i+'"></span></div></div>').join('');
    qs.forEach((q,i)=>{
      if(!q||!q.c){$('c'+i).textContent='No data';return}
      tween($('p'+i),q.c,'p'+i);
      const up=q.d>=0,el=$('c'+i);el.style.color=up?'var(--up)':'var(--dn)';
      el.textContent=(up?'▲ +':'▼ ')+q.d.toFixed(2)+' ('+(up?'+':'')+q.dp.toFixed(2)+'%)';
      $('lo'+i).textContent='$'+q.l.toFixed(2);$('hi'+i).textContent='$'+q.h.toFixed(2);
      $('r'+i).style.left='calc('+(q.h>q.l?Math.min(100,Math.max(0,(q.c-q.l)/(q.h-q.l)*100)):50)+'% - 6px)';
    });
  }catch(e){box.innerHTML='<div class="err">'+esc(e.message)+(e instanceof TypeError?'\n\nBlocked before Finnhub replied. Check the key, or ask Claude to add a small relay.':'')+'</div>'}
}

/* ---------- bus: timetable + live ---------- */
const OCC=[['Empty',1],['Plenty of seats',1],['Few seats',2],['Standing room only',3],['Very crowded',4],['Full',4],['Not taking passengers',4]],COL=['#6ee7b7','#6ee7b7','#fbbf24','#fb923c','#f87171'];
const D={},hist={};let stopPos=null,ST={t:0,rows:null};
const km=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const brg=(a,b,c,d)=>{const r=Math.PI/180,y=Math.sin((d-b)*r)*Math.cos(c*r),x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return(Math.atan2(y,x)/r+360)%360};
const hmt=t=>new Date(t*1000).toLocaleTimeString('en-NZ',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).replace(/\s/g,'').toLowerCase();
const secs=t=>{const m=/^(\d+):(\d+):(\d+)/.exec(t||'');return m?+m[1]*3600+ +m[2]*60+ +m[3]:null};
async function at(p){const r=await fetch('https://api.at.govt.nz'+p,{headers:{'Ocp-Apim-Subscription-Key':cfg().at}});if(!r.ok)throw new Error('AT returned '+r.status+' for '+p.split('?')[0]);return r.json()}
const ents=j=>(j&&j.response&&(j.response.entity||j.response.entities))||(j&&(j.entity||j.entities))||[],rows=j=>arr(j.data||j.response);
async function first(paths,ok){let last;for(const p of paths){const n=p.split('?')[0];try{const j=await at(p);if(!ok||ok(j)){D['ok: '+n]='yes';return j}D['empty: '+n]='no data'}catch(e){last=e;D['failed: '+n]=e.message}}throw last||new Error('No data')}
function diag(){$('diag').innerHTML='<summary>Diagnostics</summary><pre>'+esc(Object.entries(D).map(([k,v])=>k+': '+v).join('\n'))+'</pre>'}
async function findStop(){
  const c=cfg(),j=await first(['/gtfs/v3/stops?filter[stop_code]='+encodeURIComponent(c.stop)],j=>rows(j).length),d=rows(j)[0],a=d.attributes||d;
  stopPos={id:a.stop_id||d.id,lat:+a.stop_lat,lon:+a.stop_lon,code:c.stop};
  $('sn').textContent=c.stop;$('sname').textContent=a.stop_name||'';D.stop=stopPos.id;
}
async function timetable(){
  if(ST.rows&&Date.now()-ST.t<240000)return ST.rows;
  const p=aklParts(),hr=Math.floor(nowMin()/60),id=encodeURIComponent(stopPos.id),date=p.year+'-'+p.month+'-'+p.day;
  const j=await first(['/gtfs/v3/stops/'+id+'/stoptrips?filter[date]='+date+'&filter[start_hour]='+hr+'&filter[hour_range]=2','/gtfs/v3/stops/'+id+'/stoptrips'],j=>rows(j).length);
  const mid=Date.now()/1000-nowMin()*60,u=Date.UTC(+p.year,+p.month-1,+p.day),R=rows(j);
  ST.rows=R.map(r=>{const a=r.attributes||r,s=secs(a.arrival_time||a.departure_time),tid=a.trip_id||(r.relationships&&r.relationships.trip&&r.relationships.trip.data&&r.relationships.trip.data.id),sd=a.service_date,off=/^\d{4}-\d\d-\d\d/.test(sd||'')?(Date.UTC(+sd.slice(0,4),+sd.slice(5,7)-1,+sd.slice(8,10))-u)/1000:0;
    return {route:String(a.route_id||'').split('-')[0].toUpperCase(),trip:tid?String(tid).split('-')[0]:null,at:s==null?null:mid+off+s,seq:a.stop_sequence==null?null:+a.stop_sequence,head:a.trip_headsign||''}}).filter(r=>r.at);
  D['timetable rows']=ST.rows.length;D['timetable trip ids']=ST.rows.some(r=>r.trip)?'yes':'no (matching by order)';D['timetable fields']=Object.keys(R[0].attributes||R[0]).join(',');
  ST.t=Date.now();return ST.rows;
}
async function buses(){
  const c=cfg(),err=$('err');err.innerHTML='';
  if(!c.at){$('bl').innerHTML='<div class="note">Add your free Auckland Transport key in Settings to see live buses.</div>';return}
  try{
    if(!stopPos||stopPos.code!==c.stop){await findStop();ST.rows=null}
    const E=ents(await first(['/realtime/legacy'],j=>ents(j).length)),trips={};
    E.forEach(e=>{const t=e.trip_update,v=e.vehicle,td=(t&&t.trip)||(v&&v.trip),id=td&&td.trip_id;if(!id)return;const k=id.split('-')[0],o=trips[k]||(trips[k]={});if(t)o.tu=t;if(v)o.v=v;if(!o.td||td.route_id)o.td=td});
    const want=c.routes.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),live=[];
    Object.entries(trips).forEach(([k,o])=>{
      const route=String((o.td&&o.td.route_id)||'').split('-')[0].toUpperCase();
      if(want.length&&!want.includes(route)||(o.td&&o.td.schedule_relationship===3))return;
      const su=arr(o.tu&&o.tu.stop_time_update)[0]||{},dl=(o.tu&&o.tu.delay)??(su.arrival&&su.arrival.delay)??(su.departure&&su.departure.delay),pos=o.v&&o.v.position;
      let d=null,st='unk',c0=null;
      if(pos){
        const la=+pos.latitude,lo=+pos.longitude;d=km(stopPos.lat,stopPos.lon,la,lo);
        const vid=(o.v.vehicle&&o.v.vehicle.id)||k,ts=+o.v.timestamp||Date.now()/1000,h=hist[vid];c0=h?h.c:null;
        if(!h)hist[vid]={d,t:ts,c:null};else if(ts>h.t){c0=(h.d-d)*1000/(ts-h.t);hist[vid]={d,t:ts,c:c0}}
        if(c0!=null&&Math.abs(c0)>.8)st=c0>0?'in':'out';
        else if(pos.bearing!=null&&pos.bearing!==''&&!isNaN(+pos.bearing))st=Math.abs(((+pos.bearing-brg(la,lo,stopPos.lat,stopPos.lon))+540)%360-180)<90?'in':'out';
      }
      live.push({k,route,v:o.v,dist:d,st,c0,seq:su.stop_sequence==null?null:+su.stop_sequence,late:dl});
    });
    let tt=null;try{tt=await timetable()}catch(e){D.timetable='unavailable: '+e.message}
    const now=Date.now()/1000,out=[];
    if(tt){
      const byTrip=Object.fromEntries(live.map(l=>[l.k,l])),pool={};
      live.filter(l=>l.st!=='out'&&l.dist!=null&&l.dist<6).sort((a,b)=>a.dist-b.dist).forEach(l=>(pool[l.route]=pool[l.route]||[]).push(l));
      tt.filter(r=>want.includes(r.route)&&r.at>now-300&&r.at<now+4200).sort((a,b)=>a.at-b.at).forEach(r=>{
        let l=r.trip?byTrip[r.trip]:null;
        if(!l&&!r.trip&&pool[r.route]&&pool[r.route].length)l=pool[r.route].shift();
        if(l&&l.seq!=null&&r.seq!=null&&l.seq>r.seq)return;
        const m=(r.at+(l&&l.late!=null?l.late:0)-now)/60;
        if(m<-1||(!l&&m<0)||m>75)return;
        out.push({route:r.route,mins:Math.max(0,Math.round(m)),sched:r.at,live:!!l,late:l?l.late:null,away:l&&l.seq!=null&&r.seq!=null?r.seq-l.seq:null,prog:l&&l.seq!=null&&r.seq?Math.min(1,Math.max(0,l.seq/r.seq)):null,v:l&&l.v});
      });
    }else live.filter(l=>l.st==='in'&&l.dist!=null&&l.dist<6).forEach(l=>{const sp=l.c0>.8?Math.min(12,Math.max(3,l.c0)):6;out.push({route:l.route,mins:Math.round(l.dist*1000/sp/60),live:true,approx:1,late:l.late,v:l.v})});
    out.sort((a,b)=>a.mins-b.mins);
    const base=String(stopPos.id).split('-')[0],al=[];
    E.forEach(e=>{const a=e.alert;if(!a)return;if(arr(a.informed_entity).some(x=>(x.route_id&&want.includes(String(x.route_id).split('-')[0].toUpperCase()))||(x.stop_id&&String(x.stop_id).split('-')[0]===base))){const tr=arr(a.header_text&&a.header_text.translation)[0];if(tr&&tr.text&&!al.includes(tr.text))al.push(tr.text)}});
    $('al').innerHTML=al.length?al.slice(0,2).map(t=>'<div>⚠︎ '+esc(t)+'</div>').join(''):'';
    const sm=Object.values(trips).find(o=>o.td);
    Object.assign(D,{'live items':E.length,'live trips on your routes':live.length,'alerts in feed':E.filter(e=>e.alert).length,'alerts for you':al.length,shown:out.length,mode:tt?'timetable + live':'live position only','live trip sample':sm?JSON.stringify(sm.td):'none'});diag();
    $('bl').innerHTML=out.length?out.slice(0,4).map(b=>{
      let occ='No crowding data',lvl=0;
      if(b.v&&b.v.occupancy_status!=null){const o=b.v.occupancy_status,i=typeof o==='number'?o:['EMPTY','MANY_SEATS_AVAILABLE','FEW_SEATS_AVAILABLE','STANDING_ROOM_ONLY','CRUSHED_STANDING_ROOM_ONLY','FULL','NOT_ACCEPTING_PASSENGERS'].indexOf(o);if(OCC[i]){occ=OCC[i][0];lvl=OCC[i][1]}}
      const bd=b.late==null?'':Math.abs(b.late)<60?'<span class="bd" style="color:var(--up)">On time</span>':b.late>0?'<span class="bd" style="color:#fbbf24">'+Math.round(b.late/60)+' min late</span>':'<span class="bd" style="color:var(--ac)">'+Math.round(-b.late/60)+' min early</span>';
      const seg=[1,2,3,4].map(n=>'<u style="background:'+(n<=lvl?COL[lvl]:'')+'"></u>').join('');
      const aw=b.away!=null&&b.away>=0?' · '+(b.away===0?'at your stop':b.away+' stop'+(b.away>1?'s':'')+' away'):'';
      return '<div class="b"><b>'+b.route+'</b><span class="e">'+(b.mins<1?'Due':(b.approx?'~':'')+b.mins+'<small>min</small>')+'</span><i>'+(b.sched?hmt(b.sched)+' · ':'')+(b.live?'<span class="lv">● live</span>':'scheduled')+bd+aw+'</i>'
        +(b.prog!=null?'<div class="pg"><u style="width:'+b.prog*100+'%"></u><s style="left:'+b.prog*100+'%"></s></div><div class="pl"><span>Start</span><span>Your stop</span></div>':'')
        +(b.v?'<div class="m"><div>'+seg+'</div><span>'+occ+'</span></div>':'')+'</div>';
    }).join(''):'<div class="note">No '+esc(want.join(' or '))+' buses due at this stop in the next hour.</div>';
    $('bs').textContent=(tt?'Timetable plus live positions':'Live positions only (timetable unavailable)')+' · updated '+new Date().toLocaleTimeString('en-NZ',{timeZone:TZ,hour:'numeric',minute:'2-digit',second:'2-digit'});
  }catch(e){err.innerHTML='<div class="err">'+esc(e.message)+(e instanceof TypeError?'\n\nBlocked before AT replied (often CORS, or a wrong key). Ask Claude to add a small relay.':'')+'</div>';diag()}
}
